            ["Constitución — Módulo 1 · P3","¿Cuál de los siguientes es un ejemplo de principio constitucional mencionado en el módulo?",["Principio de proporcionalidad.","Principio de jerarquía militar.","Principio de libre empresa obligatoria.","Principio de exclusión social."],0,"Principios constitucionales implícitos o internos.","El módulo identifica expresamente la proporcionalidad, el respeto por el acto propio y la participación como ejemplos de principios constitucionales implícitos o internos."],
            ["Constitución — Módulo 1 · P4","Según el artículo 2 de la Constitución, ¿cuál es uno de los fines esenciales del Estado colombiano?",["Servir a la comunidad y promover la prosperidad general.","Concentrar todo el poder en el Presidente de la República.","Eliminar la participación ciudadana en las decisiones públicas.","Sustituir la Constitución por decretos presidenciales."],0,"Artículo 2 de la Constitución: fines esenciales del Estado.","El artículo 2 establece que el Estado debe servir a la comunidad, promover la prosperidad general, garantizar los principios, derechos y deberes constitucionales, facilitar la participación ciudadana y asegurar la convivencia pacífica y un orden justo."],
            ["Constitución — Módulo 1 · P5","¿Dónde reside exclusivamente la soberanía en Colombia?",["En el Presidente de la República, de quien emana el poder público.","En el Congreso de la República, del cual emana el poder público.","Exclusivamente en el pueblo, del cual emana el poder público.","En las Fuerzas Militares, de las cuales emana el poder público."],2,"Artículo 3 de la Constitución.","El artículo 3 dispone que la soberanía reside exclusivamente en el pueblo, del cual emana el poder público; este puede ejercerse directamente o mediante representantes."],
            ["Constitución — Módulo 1 · P6","¿Qué significa que la Constitución sea “norma de normas”?",["Que cualquier ley puede modificar la Constitución libremente cuando exista incompatibilidad entre ambas.","Que la Constitución prevalece sobre las leyes y demás normas jurídicas cuando exista incompatibilidad.","Que los decretos del Gobierno prevalecen sobre la Constitución cuando exista incompatibilidad entre ambos.","Que los tratados internacionales siempre prevalecen sobre la Constitución cuando exista incompatibilidad."],1,"Artículo 4: relación entre la Constitución y las demás normas.","El artículo 4 establece la supremacía constitucional: ante una incompatibilidad entre la Constitución y una ley u otra norma, deben aplicarse las disposiciones constitucionales."],
            ["Constitución — Módulo 1 · P7","¿Qué obligación tiene el Estado frente a la diversidad étnica y cultural de la Nación?",["Eliminarla para uniformar la cultura nacional en todo el país.","Reconocerla y protegerla en todo el territorio nacional.","Prohibir las lenguas de los grupos étnicos en el ámbito oficial.","Limitarla únicamente a las zonas rurales y apartadas del país."],1,"Artículo 7 de la Constitución.","El artículo 7 reconoce y protege la diversidad étnica y cultural de la Nación; además, el artículo 10 reconoce como oficiales las lenguas y dialectos de los grupos étnicos en sus territorios."],
            ["Constitución — Módulo 1 · P8","¿Cuál es el idioma oficial de Colombia?",["El inglés, como idioma oficial de la República.","El castellano, como idioma oficial de la República.","Las lenguas indígenas de todo el país, como idiomas oficiales.","El portugués, como idioma oficial de la República."],1,"Artículo 10 de la Constitución.","El artículo 10 establece que el castellano es el idioma oficial de Colombia; no obstante, las lenguas y dialectos de los grupos étnicos también son oficiales en sus territorios."],
            ["Constitución — Módulo 1 · P9","¿En cuántas ramas o poderes se encuentra estructurado el Estado colombiano para ejercer el poder público?",["Dos.","Tres.","Cuatro.","Cinco."],1,"Cuenta las ramas del poder público.","El Estado colombiano se estructura en las ramas Ejecutiva, Legislativa y Judicial. Son independientes, pero colaboran entre sí para cumplir los fines del Estado."],
            ["Constitución — Módulo 1 · P10","¿Qué rama del poder está representada por el Gobierno Nacional?",["Rama Legislativa.","Rama Judicial.","Rama Ejecutiva.","Rama Electoral."],2,"Piensa en quiénes integran el Gobierno Nacional.","La rama Ejecutiva está representada por el Gobierno Nacional, integrado por el Presidente de la República, los ministros y los directores de departamentos administrativos."],
            ["Constitución — Módulo 1 · P11","¿Cuál es la función principal de la rama Legislativa?",["Administrar justicia, ejercer control fiscal sobre el Gobierno y reformar la Constitución.","Formular leyes, ejercer control político sobre el Gobierno y reformar la Constitución.","Dirigir la política exterior, ejercer control político sobre el Gobierno y sancionar las leyes.","Vigilar el cumplimiento de la ley mediante superintendencias y expedir decretos reglamentarios."],1,"Piensa en el Congreso de la República.","El Congreso de la República, integrado por el Senado y la Cámara de Representantes, tiene como misión formular leyes, mantener el control político sobre el Gobierno y reformar la Constitución."],
            ["Constitución — Módulo 1 · P12","¿Quiénes integran el Congreso de la República?",["El Presidente y la Vicepresidencia.","El Senado y la Cámara de Representantes.","Las Cortes y los tribunales.","Los ministerios y departamentos administrativos."],1,"Composición del Congreso de la República.","La rama Legislativa está representada por el Congreso de la República, compuesto por el Senado y la Cámara de Representantes."],
            ["Constitución — Módulo 1 · P13","¿Cuál es la función esencial de la rama Judicial?",["Crear leyes que resuelvan los conflictos entre el Estado y los ciudadanos, o entre estos últimos.","Ejecutar las políticas públicas que resuelvan los conflictos entre el Estado y los ciudadanos.","Solucionar los conflictos entre el Estado y los ciudadanos, o entre estos últimos, administrando justicia.","Controlar políticamente al Gobierno cuando surjan conflictos entre el Estado y los ciudadanos."],2,"Piensa en quién administra justicia.","La rama Judicial está integrada por las Cortes y los tribunales, y su función es administrar justicia, resolviendo los conflictos que surjan entre el Estado y los ciudadanos o entre los propios ciudadanos."],
            ["Constitución — Módulo 1 · P14","¿Qué característica define a Colombia como Estado descentralizado?",["Todas las decisiones, competencias, funciones y recursos se concentran únicamente en la capital del país, sin que otras dependencias o niveles territoriales puedan ejercerlos.","La función administrativa puede desconcentrarse, transfiriendo competencias, funciones y recursos a otras dependencias o niveles territoriales.","Los entes territoriales carecen de autonomía y solo ejecutan las decisiones que les transfiere el nivel central.","El Presidente administra directamente todos los servicios públicos, sin trasladar competencias a otras dependencias."],1,"Descentralización territorial y por servicios.","El módulo explica que Colombia es un Estado descentralizado territorialmente y por servicios, pues la función administrativa puede desconcentrarse al transferir poder de decisión, competencias, funciones y recursos a otras dependencias."],
            ["Constitución — Módulo 1 · P15","¿Qué son los establecimientos públicos?",["Organismos que atienden funciones administrativas y prestan servicios públicos, con personería jurídica, administración y presupuesto propios.","Empresas exclusivamente privadas, sin relación alguna con el Estado, que atienden funciones administrativas y prestan servicios con personería jurídica y presupuesto propios.","Corporaciones que solo emiten conceptos jurídicos y carecen de personería jurídica, administración y presupuesto propios.","Entidades que formulan leyes en el Congreso, con personería jurídica, administración y presupuesto propios."],0,"Piensa en entidades descentralizadas por servicios.","Según el módulo, los establecimientos públicos cumplen funciones administrativas y prestan servicios públicos; cuentan con personería jurídica, administración y presupuesto propios."],
            ["Constitución — Módulo 1 · P16","¿Qué son las sociedades de economía mixta?",["Entidades constituidas únicamente con capital privado y autorizadas por la ley.","Entidades autorizadas por la ley, conformadas por capital estatal y privado de socios públicos y particulares.","Organismos judiciales especializados, autorizados por la ley, que administran justicia en asuntos económicos.","Dependencias internas de un ministerio sin personería jurídica, conformadas por capital estatal."],1,"Fíjate en el origen del capital y en el régimen según la proporción estatal.","Son entidades autorizadas por la ley que combinan capital estatal y privado. Su régimen depende de la proporción del capital estatal: si supera el 90%, se rigen como Empresas Industriales y Comerciales del Estado; en otro caso, por reglas de derecho privado."],
            ["Constitución — Módulo 1 · P17","¿Qué función cumplen las superintendencias dentro de la rama Ejecutiva?",["Formular leyes y ejercer control político sobre el Gobierno, mediante delegación del Congreso.","Administrar justicia en conflictos entre particulares, mediante delegación de la Rama Judicial.","Inspeccionar y vigilar el cumplimiento de la ley, mediante delegación del Presidente.","Reformar la Constitución y expedir códigos, mediante delegación del Congreso de la República."],2,"Rama Ejecutiva: delegación del Presidente de la República.","El módulo indica que las superintendencias cumplen labores de inspección y vigilancia del cumplimiento de la ley mediante la delegación que realiza el Presidente de la República."],
            ["Constitución — Módulo 1 · P18","¿Cuál es una finalidad del Acuerdo de Paz mencionada en el módulo?",["Eliminar la participación política de la ciudadanía y concentrarla en los partidos tradicionales del país.","Contribuir a una cultura política basada en la democracia, el libre juego de ideas y el debate civilizado.","Sustituir la Constitución por normas de carácter militar durante el período de implementación.","Restringir la reparación integral a las víctimas y limitar el libre juego de ideas en la política."],1,"Acuerdo de Paz: nueva cultura política.","El Acuerdo de Paz plantea contribuir a una nueva cultura que proscriba el uso de las armas en la política y promueva la democracia, el libre juego de ideas y el debate civilizado."],
            ["Constitución — Módulo 1 · P19","¿Qué objetivo tiene el Estado frente a las víctimas del conflicto armado, según el módulo?",["Ignorar sus derechos para priorizar la inversión privada en las zonas afectadas por el conflicto.","Atenderlas y repararlas integralmente, contribuyendo a la inclusión social y a la paz.","Trasladar toda la responsabilidad de la reparación a las propias víctimas y a sus familias.","Limitar la atención exclusivamente a la reparación económica, sin acciones de inclusión social."],1,"Atención y reparación a las víctimas del conflicto armado.","El módulo señala que el Estado y la sociedad deben liderar acciones para atender y reparar integralmente a las víctimas, contribuyendo a la inclusión social y a la paz."],
            ["Constitución — Módulo 1 · P20","¿Qué temas integran el Módulo 1 del curso de Gerentes Públicos?",["Contratación pública, selección de personal, evaluación del desempeño, régimen salarial y régimen disciplinario de los servidores públicos.","Principios constitucionales, estructura del Estado, descentralización, organización territorial e institucionalidad para el posconflicto.","Presupuesto público, contratación estatal, gestión del talento humano y control interno de las entidades del orden nacional.","Gestión del riesgo, contabilidad pública, auditoría interna y control fiscal de los recursos de las entidades territoriales."],1,"Piensa en la organización y funcionamiento del Estado colombiano.","El Módulo 1 se ocupa de la organización y funcionamiento del Estado colombiano a partir de los principios constitucionales, la estructura del Estado, la descentralización y organización territorial, y la institucionalidad para el posconflicto."],
            ["Procuraduría — Funciones y atención · P1","¿Qué entidad representa a los ciudadanos ante el Estado en Colombia?",["La Fiscalía General de la Nación","La Procuraduría General de la Nación","La Contraloría General de la República","El Consejo Superior de la Judicatura"],1,"Piensa en el Ministerio Público.","La Procuraduría es la entidad que representa a los ciudadanos ante el Estado y es el máximo organismo del Ministerio Público."],
            ["Procuraduría — Funciones y atención · P2","¿De qué organismos está conformado el Ministerio Público, además de la Procuraduría General de la Nación?",["Fiscalía y Contraloría","Defensoría del Pueblo y personerías","Corte Constitucional y Consejo de Estado","Policía Nacional y Ejército"],1,"El Ministerio Público tiene tres organismos.","El Ministerio Público está conformado por la Procuraduría, la Defensoría del Pueblo y las personerías."],
            ["Procuraduría — Funciones y atención · P3","¿Cuál es la principal responsabilidad de la Procuraduría según la función preventiva?",["Sancionar antes de investigar, castigando las posibles violaciones","Prevenir antes que sancionar, advirtiendo las posibles violaciones","Administrar directamente las entidades estatales, evitando las posibles violaciones","Representar al Estado ante los ciudadanos, atendiendo las posibles violaciones"],1,"Función preventiva de la Procuraduría.","La función preventiva busca vigilar el actuar de los servidores públicos y advertir posibles violaciones antes de que ocurran."],
            ["Procuraduría — Funciones y atención · P4","¿Qué busca la función preventiva de la Procuraduría?",["Vigilar el actuar de los servidores públicos y advertir posibles violaciones de normas antes de que ocurran","Reemplazar a las autoridades administrativas en sus decisiones cuando detecte posibles violaciones","Ejercer coadministración sobre las entidades estatales para corregir las decisiones de sus directivos","Crear nuevas leyes para el país que sancionen las violaciones de las normas por parte de los servidores"],0,"Función preventiva: vigilar sin intervenir en la gestión.","La Procuraduría previene sin intervenir directamente en la gestión de las entidades estatales."],
            ["Procuraduría — Funciones y atención · P5","¿Qué tipo de autonomía tiene la Procuraduría General de la Nación?",["Únicamente autonomía administrativa, pues su presupuesto depende del Ministerio de Hacienda","Autonomía administrativa, financiera y presupuestal, conforme al Estatuto Orgánico del Presupuesto","Autonomía política, administrativa y militar, conforme al Estatuto Orgánico del Presupuesto","Ninguna autonomía, pues es una dependencia de la Presidencia de la República sin presupuesto propio"],1,"Estatuto Orgánico del Presupuesto Nacional.","La Procuraduría cuenta con autonomía administrativa, financiera y presupuestal, conforme al Estatuto Orgánico del Presupuesto Nacional."],
            ["Procuraduría — Funciones y atención · P6","¿Cuál es una de las funciones de intervención de la Procuraduría?",["Intervenir ante jurisdicciones como la Contencioso Administrativa, Constitucional, penal, civil, laboral y de familia","Dictar sentencias definitivas en las jurisdicciones Contencioso Administrativa, Constitucional, penal, civil, laboral y de familia","Administrar las cárceles y los establecimientos de reclusión de las jurisdicciones penal y de familia","Nombrar a los jueces de las jurisdicciones Contencioso Administrativa, penal, civil, laboral y de familia"],0,"Función de intervención de la Procuraduría.","La Procuraduría actúa como sujeto procesal ante varias jurisdicciones y autoridades.",{"url":"medidas_cautelares.html","text":"Para profundizar: medidas cautelares (CPACA, arts. 229 y ss.)"}],
            ["Procuraduría — Funciones y atención · P7","¿Qué función cumple la Procuraduría en materia disciplinaria?",["Iniciar, adelantar y fallar investigaciones por faltas disciplinarias de los servidores públicos","Solo recibir quejas y remitirlas a las oficinas de control interno sin investigarlas","Sancionar penalmente a los servidores que incurran en faltas disciplinarias gravísimas","Representar exclusivamente a los servidores públicos investigados en los procesos disciplinarios"],0,"Función disciplinaria de la Procuraduría.","La Procuraduría investiga y sanciona faltas disciplinarias de servidores públicos y de particulares con funciones públicas."],
            ["Procuraduría — Funciones y atención · P8","¿A quiénes puede investigar disciplinariamente la Procuraduría, además de los servidores públicos?",["A cualquier ciudadano particular, aunque no ejerza funciones públicas ni maneje dineros del Estado","A particulares que ejercen funciones públicas o manejan dineros del Estado, además de los servidores públicos","Solo a miembros de la Fuerza Pública que ejercen funciones públicas o manejan dineros del Estado","A empresas privadas sin relación con el Estado que manejan sus propios recursos"],1,"Sujetos de la función disciplinaria.","La función disciplinaria también aplica a particulares que cumplen funciones públicas o administran recursos estatales."],
            ["Procuraduría — Funciones y atención · P9","¿Bajo qué normas se desarrolla la función disciplinaria de la Procuraduría?",["Código General Disciplinario, Ley 1952 de 2019 y Ley 2094 de 2021","Código Penal Único (Ley 599 de 2000) y Código de Procedimiento Penal","Constitución Política de 1991 y Ley 734 de 2002 únicamente, sin normas posteriores","Ley 1437 de 2011 (CPACA) y Ley 1755 de 2015, que regulan el derecho de petición"],0,"Normas que regulan la función disciplinaria.","Estas normas regulan el ejercicio de la función disciplinaria de la Procuraduría."],
            ["Procuraduría — Funciones y atención · P10","¿Cómo se describe la facultad de intervención de la Procuraduría?",["Es facultativa y opcional, y se desarrolla de manera general cuando el Procurador General lo considere necesario","Es imperativa y se desarrolla de forma selectiva cuando el Procurador General lo considere necesario","Solo aplica en procesos penales, de manera selectiva cuando el Procurador General lo considere necesario","No tiene relación con derechos fundamentales, y se desarrolla cuando el Procurador General lo considere necesario"],1,"Facultad de intervención: obligatoria o facultativa, general o selectiva.","La intervención es obligatoria pero selectiva, y se enfoca en la defensa de derechos y garantías fundamentales."],
            ["Procuraduría — Funciones y atención · P11","¿Cuál es la dirección de la sede principal de la Procuraduría General de la Nación?",["Carrera 7 # 15-80, Bogotá","Carrera 5 # 15-80, Bogotá D.C.","Calle 100 # 15-80, Bogotá","Avenida El Dorado # 15-80, Bogotá"],1,"Sede principal en Bogotá D.C.","Esta es la dirección oficial de la sede principal de la Procuraduría."],
            ["Procuraduría — Funciones y atención · P12","¿Cuál es el horario de atención de la sede principal de la Procuraduría?",["Lunes a viernes, 8:00 a.m. a 5:00 p.m., jornada continua","Lunes a viernes, 9:00 a.m. a 4:00 p.m., con pausa al mediodía","Lunes a sábado, 8:00 a.m. a 12:00 m., jornada continua","Lunes a domingo, de 6:00 a.m. a 10:00 p.m., jornada continua"],0,"Horario oficial de la sede principal.","Este es el horario oficial de atención de la sede principal."],
            ["Procuraduría — Funciones y atención · P13","¿Cuál es el número de la línea gratuita y anticorrupción de la Procuraduría?",["01 8000 940 808","01 8000 123 456","601 587 8750","01 8000 111 222"],0,"Línea gratuita y línea anticorrupción.","Este número sirve tanto como línea gratuita como línea anticorrupción."],
            ["Procuraduría — Funciones y atención · P14","¿Qué tipo de trámites se pueden realizar a través de la Sede Electrónica de la Procuraduría?",["Radicar PQRSDF, solicitudes de conciliación y consultas de estado de radicaciones","Solo pagar multas de tránsito y consultar el estado de procesos penales en curso","Solicitar pasaportes y certificados de antecedentes judiciales ante la Policía Nacional","Realizar declaraciones de renta y consultar el estado de las devoluciones de impuestos"],0,"Sede Electrónica de la Procuraduría.","La Sede Electrónica permite realizar estos y otros trámites en línea."],
            ["Procuraduría — Funciones y atención · P15","¿Para quién es exclusivo el buzón de notificaciones judiciales de la Procuraduría?",["Para cualquier ciudadano que quiera notificar a la Procuraduría de un trámite","Para juzgados, tribunales y altas cortes que notifican a la Procuraduría","Para empresas privadas que deban notificar actuaciones a la Procuraduría","Para estudiantes universitarios que adelanten consultorios jurídicos ante la Procuraduría"],1,"Buzón de notificaciones judiciales.","El buzón judicial es exclusivo para que los despachos judiciales realicen notificaciones a la Procuraduría."],
            ["Procuraduría — Funciones y atención · P16","¿Qué artículo de la Ley 1437 de 2011 regula el buzón de notificaciones judiciales?",["Artículo 100","Artículo 197","Artículo 250","Artículo 300"],1,"Ley 1437 de 2011 (CPACA).","Este artículo establece la obligación de tener un buzón electrónico para notificaciones judiciales."],
            ["Procuraduría — Funciones y atención · P17","¿Cuál es el correo electrónico del buzón de notificaciones judiciales de la Procuraduría?",["procesosjudiciales@procuraduria.gov.co","notificacionesjudiciales@procuraduria.gov.co","buzonjudicial@procuraduria.gov.co","notificaciones.procesos@procuraduria.gov.co"],0,"Correo exclusivo para notificaciones judiciales.","Este es el correo oficial y exclusivo para notificaciones judiciales."],
            ["Procuraduría — Funciones y atención · P18","¿Qué tipo de usuario puede radicar PQRSDF de forma anónima en la Sede Electrónica?",["El usuario registrado, con clave y datos personales verificados","El usuario sin registro, que debe identificarse en cada radicación","El usuario anónimo, sin dejar registro de su dirección IP","El usuario administrador, con permisos de gestión sobre la Sede Electrónica"],2,"Tipos de usuario de la Sede Electrónica.","El usuario anónimo puede generar radicaciones de PQRSDF y realizar consultas sin dejar registro de su dirección IP."],
            ["Procuraduría — Funciones y atención · P19","¿Qué debe hacer un usuario para acceder a formularios de envío de sanciones SIRI en la Sede Electrónica?",["No requiere registro, pues puede ingresar como usuario anónimo a la Sede Electrónica","Debe registrarse como usuario registrado en la Sede Electrónica de la Procuraduría","Solo necesita llamar por teléfono a la línea gratuita de la Procuraduría","Debe enviar una carta física a la sede principal de la Procuraduría"],1,"Sistema de Registro de Sanciones (SIRI).","Los formularios SIRI están disponibles solo para usuarios registrados."],
            ["Procuraduría — Funciones y atención · P20","¿Cuál es el teléfono conmutador de la sede principal de la Procuraduría?",["+57 601 587 8750","+57 601 123 4567","+57 601 987 6543","+57 601 555 1234"],0,"Teléfono de la sede principal.","Este es el número oficial del conmutador de la sede principal."],
            ["Procuraduría — Ubicación en el Estado","Respecto a la Procuraduría General de la Nación, ¿cuál afirmación es correcta?",["Es un organismo de la rama ejecutiva, adscrito a la Presidencia de la República, que ejerce el control disciplinario y encabeza el Ministerio Público.","Es un organismo autónomo de control del Estado, separado de las ramas ejecutiva, legislativa y judicial, que encabeza el Ministerio Público.","Hace parte de la rama judicial, su nombre correcto es Procuraduría Nacional de la Nación y encabeza el Ministerio Público.","Es una dependencia del Congreso encargada de expedir las leyes disciplinarias y de encabezar el Ministerio Público."],1,"Fíjate en el nombre oficial y en el lugar que ocupa frente a las tres ramas.","La entidad se llama Procuraduría General de la Nación (no “nacional”). Es un organismo autónomo de control del Estado colombiano, separado de las ramas ejecutiva, legislativa y judicial, y encabeza el Ministerio Público."],
            ["Disciplinario — Órganos competentes","¿Qué significa que la Procuraduría General de la Nación tenga poder disciplinario preferente?",["Que solo puede investigar a los servidores de la Rama Judicial, asumiendo las investigaciones de otras autoridades.","Que puede iniciar, proseguir o asumir (avocar) investigaciones que adelanten otras autoridades o dependencias internas.","Que únicamente actúa como segunda instancia de las Oficinas de Control Disciplinario Interno, sin iniciar investigaciones.","Que las Personerías deben entregarle todos sus expedientes y dejar de investigar a los servidores municipales."],1,"La PGN es el máximo órgano del Ministerio Público.","La PGN posee el poder disciplinario preferente, que le permite iniciar, proseguir o asumir (avocar) investigaciones que estén adelantando otras autoridades o dependencias internas."],
            ["Disciplinario — Etapas del proceso","¿Cuándo procede la indagación previa en el proceso disciplinario?",["Siempre, como primera etapa obligatoria de todo proceso, aunque el presunto autor ya esté identificado.","Cuando existe duda sobre la identificación o individualización del presunto autor de la falta.","Cuando ya se notificó el pliego de cargos al investigado y se abrió la etapa de juzgamiento.","Únicamente cuando el fallo sancionatorio ya fue apelado y debe revisarse la identificación del autor."],1,"Es una etapa opcional y eventual.","La indagación previa es opcional y eventual: procede cuando hay duda sobre la identificación del presunto autor. Busca individualizar al responsable y recaudar información inicial; tiene un término general de 6 meses y concluye con archivo definitivo o auto de apertura de investigación."],
            ["Disciplinario — Reglas y garantías","Una falta disciplinaria leve cometida con culpa se sanciona con:",["Multa, como sanción de las faltas leves cometidas con culpa.","Amonestación escrita, como sanción de las faltas leves cometidas con culpa.","Suspensión en el ejercicio del cargo, como sanción de las faltas leves cometidas con culpa.","Destitución e inhabilidad general, como sanción de las faltas leves cometidas con culpa."],1,"Graduación de sanciones según la clase de falta.","Las faltas leves se sancionan con multa si son dolosas y con amonestación escrita si son culposas."],
            ["Disciplinario — Órganos competentes (2)","En materia disciplinaria, ¿cuál afirmación sobre el poder preferente a nivel municipal es correcta?",["Solo la Procuraduría puede ejercerlo; las personerías únicamente reciben quejas y las remiten a las oficinas de control interno de la administración municipal sin asumir investigaciones.","La Procuraduría y las personerías pueden asumir investigaciones de otras autoridades; las personerías lo aplican sobre la administración municipal.","Las oficinas de control interno pueden asumir las investigaciones que adelanta la Procuraduría; las personerías lo aplican sobre la administración municipal.","La Procuraduría y las personerías pueden asumir investigaciones de otras autoridades; las personerías lo aplican sobre las entidades del orden nacional."],1,"Piensa en qué autoridades pueden asumir investigaciones de otras y en el nivel donde actúan las personerías.","Las personerías, la Procuraduría y las oficinas de control interno de las entidades públicas investigan y sancionan disciplinariamente. La Procuraduría y las personerías tienen poder disciplinario preferente, es decir, pueden asumir investigaciones de otras autoridades; en el caso de las personerías, lo aplican sobre la administración municipal."],
            ["Disciplinario — Etapas del proceso (2)","Al concluir la investigación disciplinaria, ¿qué puede ocurrir y qué recurso procede contra el pliego de cargos?",["Siempre concluye en pliego de cargos, contra el cual procede el recurso de apelación ante la segunda instancia.","Solo puede concluir en archivo, porque el pliego de cargos lo formula la segunda instancia al resolver la apelación.","Puede concluir en archivo o en pliego de cargos; contra el pliego de cargos no procede ningún recurso.","Concluye en fallo sancionatorio directo, sin pliego de cargos, y contra este procede el recurso de apelación."],2,"Si hay mérito, la investigación puede terminar de dos maneras distintas.","La investigación se inicia si hay mérito y puede concluir en un archivo o en un pliego de cargos. Contra el pliego de cargos no procede ningún recurso."],
            ["Disciplinario — Recursos y decisiones","Contra un fallo sancionatorio procede apelación. Si el investigado es el apelante único, ¿qué ocurre con la decisión de la segunda instancia?",["Resolver la apelación sin poder empeorar su situación.","Puede aumentar la sanción si lo considera necesario.","Debe devolver el proceso a la indagación previa.","Debe declarar que contra el fallo no procede ningún recurso."],0,"Piensa en la garantía de quien apela solo.","Frente a un fallo sancionatorio cabe apelación, pero si el investigado es apelante único, la segunda instancia no podrá empeorar su situación."],
            ["Disciplinario — Alcaldes y gobernadores (competencia)","¿Qué autoridad es competente para iniciar investigaciones disciplinarias contra alcaldes y gobernadores?",["La Procuraduría General de la Nación, como autoridad disciplinaria de alcaldes y gobernadores.","Las personerías municipales, como autoridad disciplinaria de alcaldes y gobernadores.","Las oficinas de control interno disciplinario, como autoridad disciplinaria de alcaldes y gobernadores.","La Contraloría General de la República, como autoridad disciplinaria de alcaldes y gobernadores."],0,"Piensa en qué autoridades NO tienen competencia sobre servidores elegidos por voto popular.","La Procuraduría es la competente para iniciar investigaciones disciplinarias a alcaldes y gobernadores. Por eso, las personerías y las oficinas de control interno disciplinario de alcaldías y gobernaciones no tienen competencia para ello."],
            ["Disciplinario — Alcaldes y gobernadores (destitución)","Si la Procuraduría dicta un fallo de destitución contra un alcalde o gobernador, ¿qué ocurre con ese fallo?",["Se ejecuta de inmediato, porque la Procuraduría es la autoridad disciplinaria competente y su fallo no requiere revisión.","No se ejecuta de inmediato: pasa de manera automática al Consejo de Estado para su revisión, aunque el alcalde o gobernador no la pida.","Solo se revisa si el alcalde o gobernador interpone un recurso, pues el Consejo de Estado no actúa de oficio.","Lo ejecuta directamente el Concejo o la Asamblea, que deben confirmar la destitución sin más trámite que su aprobación por mayoría."],1,"Piensa en quién puede remover a una autoridad elegida por voto popular.","El fallo de destitución no se ejecuta de manera inmediata: pasa de forma automática al Consejo de Estado para su revisión, incluso si el alcalde o gobernador no lo piden. Esto se debe a que en Colombia solamente una autoridad judicial puede remover a una autoridad elegida por voto popular."],
            ["Disciplinario — Alcaldes y gobernadores (suspensión provisional)","¿Qué requisitos deben darse para que la Procuraduría suspenda provisionalmente a un alcalde o gobernador mientras sigue la investigación?",["Que la falta sea leve o grave y que el investigado lo solicite, siempre que exista riesgo de que interfiera en la investigación o continúe con la conducta.","Que el Consejo de Estado ya haya revisado el fallo de destitución y existan elementos que indiquen que podría interferir en la investigación.","Que la falta sea grave o gravísima y existan elementos que indiquen que, desde su cargo, podría interferir en la investigación o continuar con la conducta.","Que el Concejo o la Asamblea autorice la suspensión y existan elementos que indiquen que podría interferir en la investigación o continuar con la conducta."],2,"La suspensión provisional exige dos condiciones: la clase de falta y un riesgo durante la investigación.","Lo que sí puede hacer la Procuraduría es apartarlo del cargo mientras sigue la investigación mediante una suspensión provisional. Para que opere, la falta debe ser grave o gravísima y debe haber elementos que indiquen que el alcalde o gobernador, desde su cargo, puede interferir en la investigación o continuar con la comisión de la conducta."],
            ["Disciplinario — Sanciones según la falta (graves)","¿Con qué sanción se castigan las faltas disciplinarias graves?",["Multa o amonestación escrita, con anotación en la hoja de vida del servidor y reporte al superior.","Suspensión en el ejercicio del cargo e inhabilidad especial, con anotación en la hoja de vida del servidor.","Destitución e inhabilidad general de 10 a 20 años, con anotación en la hoja de vida del servidor.","Un llamado de atención verbal, con anotación en la hoja de vida del servidor y reporte al superior."],1,"Graduación de sanciones según la clase de falta.","Según la graduación de sanciones, las faltas graves se sancionan con suspensión en el ejercicio del cargo e inhabilidad especial. Las leves se sancionan con multa (si son dolosas) o amonestación escrita (si son culposas), y las gravísimas con dolo con destitución e inhabilidad general."],
            ["Disciplinario — Sanciones según la falta (gravísimas)","Una falta disciplinaria gravísima cometida con dolo conlleva:",["Multa, con inhabilidad general de 1 a 5 años para ejercer cargos públicos.","Suspensión en el ejercicio del cargo e inhabilidad especial por un período de 3 meses.","Destitución e inhabilidad general de 10 a 20 años, como sanción principal de la falta.","Amonestación escrita y capacitación obligatoria sobre el régimen disciplinario."],2,"Graduación de sanciones: la clase de falta más severa y el elemento subjetivo (dolo).","Las faltas gravísimas cometidas con dolo conllevan destitución e inhabilidad general de 10 a 20 años."],
            ["Disciplinario — Suspensión provisional vs. suspensión como sanción","¿Cuál es la diferencia entre la suspensión provisional y la suspensión como sanción disciplinaria?",["La suspensión provisional se impone en el fallo como sanción definitiva por faltas graves; la suspensión como sanción es una medida cautelar que se aplica durante la investigación.","La provisional es una medida para apartar al investigado del cargo mientras sigue la investigación; la suspensión en el ejercicio del cargo es una sanción propia de las faltas graves.","Ambas son sanciones definitivas que se imponen en el fallo; la única diferencia es que la provisional dura menos tiempo que la suspensión en el cargo.","La provisional solo procede por faltas leves y se impone durante la investigación; la sanción solo procede por faltas gravísimas y se impone en el fallo."],1,"Una ocurre mientras sigue la investigación; la otra, al final, con el fallo.","La suspensión provisional aparta al investigado del cargo mientras sigue la investigación y requiere falta grave o gravísima y riesgo de interferir en la investigación o de continuar la conducta. La suspensión en el ejercicio del cargo, en cambio, es la sanción que corresponde a las faltas graves."],
            ["Destitución y Suspensión Disciplinaria — Cuestionario compartido","Un alcalde elegido por voto popular lleva suspendido provisionalmente por riesgo de interferir en la investigación. La Procuraduría dicta en segunda instancia fallo de destitución y el alcalde manifiesta por escrito que no solicitará revisión. ¿Qué procede respecto a la destitución?",["Esperar la revisión automática del Consejo de Estado y ejecutar la destitución solo si este la confirma, aunque el alcalde no la pida.","Ejecutar el fallo de inmediato, porque el alcalde manifestó por escrito que no solicitará la revisión del Consejo de Estado.","Dar por ejecutada la destitución, porque la suspensión provisional ya equivale al retiro definitivo del alcalde del cargo.","Archivar el fallo disciplinario hasta que el alcalde presente una demanda ordinaria de nulidad ante la jurisdicción contencioso administrativa."],0,"Piensa qué ocurre en Colombia cuando una autoridad administrativa dicta destitución contra un mandatario elegido por voto popular, aun sin petición del investigado.","El fallo de destitución contra un alcalde o gobernador no se ejecuta de inmediato: pasa de forma automática al Consejo de Estado para su revisión, incluso si el alcalde no la pide, porque solo una autoridad judicial puede remover a una autoridad elegida por voto popular. La suspensión provisional es solo una medida para apartarlo del cargo mientras sigue la investigación; no equivale al retiro definitivo."],
            ["Disciplinario — Juicio verbal por flagrancia","Un noticiero graba en vivo a un alcalde mientras entrega fajos de billetes a sufragantes dentro de un puesto de votación, y la policía lo intercepta con el dinero. La Procuraduría asume el expediente y su apoderado pide abrir una indagación escrita de seis meses. ¿Qué vía procesal procede?",["El juicio verbal, porque fue sorprendido en el momento de la comisión de la falta o con elementos provenientes de ella, salvo decisión motivada de tramitar el procedimiento ordinario.","El procedimiento ordinario con etapa de instrucción escrita, porque la indagación previa es obligatoria en todo proceso contra servidores de elección popular.","El archivo de la actuación por falta de competencia, porque las conductas electorales solo pueden ser investigadas por el Consejo Nacional Electoral."],0,"Piensa en qué ocurre cuando el investigado es sorprendido al cometer la falta.","El Art. 225A de la Ley 1952 (adicionado por la Ley 2094 de 2021) manda el juicio verbal cuando el disciplinable es sorprendido en el momento de la comisión de la falta o con elementos, efectos o instrumentos de ella. El parágrafo permite tramitar el procedimiento ordinario, con decisión motivada, en casos excepcionales."],
            ["Disciplinario — Edicto: citación previa","¿Qué debe hacerse antes de notificar por edicto una decisión disciplinaria al investigado?",["Citarlo por un medio eficaz a la entidad donde trabaja o a su última dirección registrada, y esperar cinco días sin que comparezca.","Publicar un aviso en un diario de amplia circulación y esperar diez días sin que comparezca ante la secretaría del despacho.","Enviarle una citación por correo certificado a su domicilio y esperar tres días sin que presente recurso alguno.","Citar únicamente a su defensor de oficio y esperar cinco días antes de fijar el edicto en la secretaría."],0,"Piensa en la citación previa y en el tiempo de espera antes de fijar el edicto.","Según el Art. 127 de la Ley 1952, primero se cita al investigado por un medio eficaz a la entidad donde trabaja o a la última dirección registrada en su hoja de vida o en el proceso. Si no comparece dentro de los 5 días siguientes, se notifica por edicto."],
            ["Disciplinario — Edicto: fijación","Vencidos los cinco días sin que el investigado comparezca, ¿por cuánto tiempo se fija el edicto?",["Por cinco días, en la página web de la entidad y sin fijarlo en la secretaría.","Por tres días, en un lugar visible de la secretaría del despacho.","Por diez días, en un lugar visible de la secretaría del despacho.","Por un día, en un lugar visible de la sede de la Procuraduría."],1,"Es un plazo corto, menor que el de espera.","El edicto se fija por 3 días en la secretaría del despacho, y con ello se comunica oficialmente la decisión (Art. 127 de la Ley 1952)."],
            ["Disciplinario — Edicto: investigado con defensor","Si el investigado está asistido por un defensor, ¿cómo se notifica la decisión?",["Debe notificarse siempre al investigado en forma personal, además de su defensor, antes de que quede en firme.","Se notifica por edicto al investigado y por aviso al defensor, dentro de los cinco días siguientes.","Se notifica únicamente al jefe de la entidad donde trabaja el investigado y se le informa por escrito.","La notificación se surte directamente con el defensor, sin necesidad de citar al investigado."],3,"Piensa en quién representa al investigado en el proceso.","Cuando el investigado tiene defensor, la notificación se hace con él (Art. 127 de la Ley 1952)."],
            ["Disciplinario — Cosa juzgada","¿Qué efecto tiene la cosa juzgada disciplinaria para un servidor absuelto?",["Que la investigación solo se suspende y puede reabrirse durante cinco años si aparecen nuevos testigos o pruebas.","Que el expediente se archiva en la entidad nominadora y queda una anotación preventiva en sus antecedentes.","Que el Procurador puede revocar de oficio el fallo absolutorio cuando el quejoso manifieste inconformidad.","Que no puede ser investigado, juzgado ni sancionado de nuevo por los mismos hechos, una vez en firme la decisión."],3,"Piensa en la seguridad jurídica de quien ya fue absuelto.","La cosa juzgada disciplinaria da carácter definitivo a la decisión en firme: el absuelto no puede ser investigado, juzgado ni sancionado de nuevo por los mismos hechos."],
            ["Disciplinario — Prescripción (regla general)","¿En cuántos años prescribe, por regla general, la acción disciplinaria (Art. 33 de la Ley 1952, modificado por la Ley 2094 de 2021)?",["En tres años, contados desde que el quejoso presenta la queja ante la Procuraduría o la oficina de control interno.","En cinco años, contados desde la consumación en las faltas instantáneas y desde el último hecho en las permanentes.","En diez años, contados desde que se abre formalmente la investigación disciplinaria contra el servidor.","En dos años, contados desde que el servidor se retira definitivamente del cargo que ocupaba."],1,"Fíjate en el plazo general y en desde cuándo se cuenta.","La acción disciplinaria prescribe en 5 años: en las faltas instantáneas se cuentan desde su consumación; en las permanentes o continuadas, desde el último hecho o acto (Art. 33 de la Ley 1952, modificado por el Art. 7 de la Ley 2094)."],
            ["Disciplinario — Prescripción (12 años)","¿Cuál es el término de prescripción de la acción disciplinaria para las faltas del artículo 52 de la Ley 1952 (relacionadas con infracciones al derecho internacional de los derechos humanos y al DIH)?",["Cinco años, igual que la regla general, y se interrumpe con la notificación del auto de cargos.","Veinte años, y se interrumpe con la apertura formal de la investigación disciplinaria.","Diez años, y no admite ninguna interrupción mientras se tramita el proceso disciplinario.","Doce años, y la prescripción se interrumpe con la notificación del fallo de primera instancia."],3,"Es un plazo mayor que el de la regla general.","Para las faltas del artículo 52 de la Ley 1952 el término de prescripción es de 12 años (Art. 33, modificado por la Ley 2094 de 2021), y se interrumpe con la notificación del fallo de primera instancia."],
            ["Procuraduría — Ministerio Público: distribución de funciones","En una protesta social con denuncias de abusos, el Defensor del Pueblo verifica la situación de los retenidos, y el Procurador Provincial abre una indagación y suspende provisionalmente al comandante de la estación. El oficial alega nulidad por 'duplicidad de funciones'. ¿Cómo se resuelve?",["El Procurador debe coordinar a la Defensoría para unificar en una sola causa la acción de derechos humanos y el control disciplinario, so pena de nulidad.","Aunque el Ministerio Público tiene una dirección unificada, sus funciones están distribuidas: la Defensoría protege los derechos humanos y la Procuraduría vigila la conducta oficial.","La intervención de la Defensoría es un requisito previo para que la Procuraduría pueda iniciar la acción disciplinaria preferente contra el oficial."],1,"Piensa en cómo se reparten las funciones dentro del Ministerio Público.","El Ministerio Público lo ejercen el Procurador General, el Defensor del Pueblo, los procuradores delegados y agentes, y los personeros (Art. 118 CP). A la Defensoría le corresponde proteger los derechos humanos; a la Procuraduría, vigilar la conducta oficial. No hay duplicidad ni nulidad."],
            ["Procuraduría — Tres funciones","¿Cuáles son las tres grandes funciones de la Procuraduría General de la Nación?",["Preventiva, de fiscalización y de juzgamiento penal.","Preventiva, de intervención y disciplinaria.","Disciplinaria, de control fiscal y de intervención legislativa.","Preventiva, de investigación penal y de control político."],1,"Una busca evitar el daño, otra actúa ante los jueces y otra sanciona faltas.","La Procuraduría ejerce una función preventiva (vigilar y advertir), una función de intervención (ante jurisdicciones y autoridades) y una función disciplinaria (investigar y sancionar faltas)."],
            ["Constitución — Hábeas corpus","¿En qué término debe resolverse el hábeas corpus según el Art. 30 de la Constitución?",["En treinta y seis horas.","En diez días hábiles.","En setenta y dos horas.","En quince días hábiles."],0,"Es un plazo medido en horas, no en días.","El Art. 30 de la Constitución dice que quien crea estar privado ilegalmente de su libertad puede invocar el hábeas corpus ante cualquier autoridad judicial, y que debe resolverse en 36 horas."],
            ["Constitución — Acción de grupo","¿Cuántas personas, como mínimo, deben presentar una acción de grupo para reparar un daño causado por una misma causa?",["Al menos veinte personas, que hayan sufrido un daño por la misma causa.","Al menos cinco personas, que hayan sufrido un daño por la misma causa.","Al menos cincuenta personas, que hayan sufrido un daño por la misma causa.","Al menos diez personas, que hayan sufrido un daño por la misma causa."],0,"Ley 472 de 1998: es una acción para obtener indemnización colectiva.","La acción de grupo (Art. 88 CP y Ley 472 de 1998) la ejerce un número plural de personas, no inferior a veinte, que sufrieron perjuicios individuales por una misma causa."],
            ["Constitución — Tutela: término","Según el Art. 86 de la Constitución, ¿cuál es el plazo máximo entre la solicitud de tutela y su resolución?",["Treinta días, contados desde que se presenta la solicitud.","Diez días, contados desde que se presenta la solicitud.","Veinte días, contados desde que se presenta la solicitud.","Cinco días, contados desde que se presenta la solicitud."],1,"Es el término de un procedimiento preferente y sumario.","El Art. 86 de la Constitución dispone que en ningún caso pueden transcurrir más de diez días entre la solicitud de tutela y su resolución. (Si esos días son hábiles o calendario no lo verifiqué.)"],
            ["Constitución — Tutela transitoria","¿Cuándo puede usarse la tutela aunque exista otro medio de defensa judicial?",["Cuando el afectado prefiere la tutela porque el proceso ordinario le resulta más lento y costoso.","Cuando la vulneración recae sobre derechos de contenido económico que no son fundamentales.","Cuando el juez ordinario todavía no ha fijado fecha de audiencia para resolver el asunto.","Cuando se utiliza como mecanismo transitorio para evitar un perjuicio irremediable."],3,"Piensa en el daño que no se podría reparar después.","El Art. 86 de la Constitución dice que la tutela solo procede cuando el afectado no dispone de otro medio de defensa judicial, salvo que se utilice como mecanismo transitorio para evitar un perjuicio irremediable."],
            ["Constitución — Acción popular","¿Qué acción protege los derechos e intereses colectivos, como el goce de un ambiente sano, y puede buscar que las cosas vuelvan a su estado anterior?",["La acción de grupo (Art. 88 CP y Ley 472 de 1998).","La acción de cumplimiento (Art. 87 CP y Ley 393 de 1997).","La acción popular (Art. 88 CP y Ley 472 de 1998).","La acción de tutela (Art. 86 CP y Decreto 2591 de 1991)."],2,"Protege a toda la comunidad, no a una persona en particular.","La acción popular protege los derechos e intereses colectivos y puede buscar restituir las cosas a su estado anterior cuando sea posible. La de grupo busca indemnizar daños a un conjunto de personas."],
            ["Constitución — Acción de cumplimiento","¿Qué acción permite exigir ante un juez el cumplimiento de una ley o de un acto administrativo?",["La acción de cumplimiento (Art. 87 CP y Ley 393 de 1997).","La acción popular (Art. 88 CP y Ley 472 de 1998).","El recurso de reposición (Art. 74 de la Ley 1437 de 2011).","La acción de tutela (Art. 86 CP y Decreto 2591 de 1991)."],0,"Sirve para que la autoridad haga lo que la ley o un acto ya le ordenan.","El Art. 87 de la Constitución permite a toda persona acudir ante la autoridad judicial para hacer efectivo el cumplimiento de una ley o de un acto administrativo (Ley 393 de 1997)."],
            ["Constitución — Revocatoria del mandato","¿Qué mecanismo de participación permite a los ciudadanos dar por terminado el mandato de un alcalde o de un gobernador?",["El cabildo abierto, que se somete a debate en sesión pública del concejo.","El referendo derogatorio, que se somete a votación sobre una norma ya vigente.","La revocatoria del mandato, que se somete a votación de los ciudadanos.","La consulta popular, que se somete a votación sobre una pregunta de interés general."],2,"Es uno de los siete mecanismos del Art. 103 de la Constitución.","La revocatoria del mandato es el mecanismo por el cual los ciudadanos dan por terminado el mandato de un alcalde o de un gobernador (Art. 103 CP)."],
            ["Constitución — Defensor del Pueblo","¿Cómo se elige al Defensor del Pueblo?",["Lo elige el Senado de la República, de terna presentada por el Presidente de la República, para un período de cuatro años.","Lo elige la Cámara de Representantes, de terna presentada por la Corte Suprema de Justicia, para un período de ocho años.","Lo elige la Cámara de Representantes, de terna presentada por el Presidente de la República, para un período de cuatro años.","Lo elige el Presidente de la República, de terna presentada por el Procurador General, para un período de cuatro años."],2,"Es distinto a cómo se elige al Procurador.","El Art. 281 de la Constitución establece que el Defensor del Pueblo es elegido por la Cámara de Representantes, de terna presentada por el Presidente, para un período de cuatro años."],
            ["Constitución — Órganos autónomos","¿Cuál de estos organismos pertenece a la Rama Ejecutiva y no es un órgano autónomo e independiente?",["El Ministerio de Hacienda y Crédito Público, que integra el Gobierno Nacional.","La Registraduría Nacional del Estado Civil, que organiza las elecciones.","La Comisión Nacional del Servicio Civil, que administra la carrera administrativa.","El Banco de la República, que cumple las funciones de banca central."],0,"Los ministerios forman parte del Gobierno Nacional.","Los ministerios hacen parte del Gobierno Nacional, en la Rama Ejecutiva. La Registraduría, la CNSC y el Banco de la República son órganos autónomos e independientes."],
            ["Empleo y control — Cambio de naturaleza del empleo","Laura es empleada de carrera. La entidad cambia la naturaleza de su empleo a libre nombramiento y remoción, y no hay vacantes de carrera con funciones afines. ¿Qué ocurre con ella?",["Continúa desempeñando el mismo cargo y conserva sus derechos de carrera mientras permanezca en él.","Debe ser retirada del servicio con indemnización, porque su empleo dejó de pertenecer a la carrera administrativa.","Pasa a ser empleada de libre nombramiento y remoción y pierde sus derechos de carrera desde ese momento.","Debe ser encargada en otro empleo de cualquier nivel hasta que se abra una vacante de carrera afín."],0,"Piensa en qué protege la ley cuando cambia la naturaleza del empleo.","Según el Art. 6 de la Ley 909 de 2004, si el empleo de un empleado de carrera cambia a libre nombramiento y remoción, debe ser reubicado en un cargo de carrera con funciones afines si hay vacante; si no la hay, continúa en el mismo cargo y conserva sus derechos de carrera mientras permanezca en él."],
            ["Empleo y control — Período de prueba","Una persona que no está inscrita en carrera administrativa gana un concurso y es nombrada en período de prueba de seis meses. Si obtiene una calificación insatisfactoria en firme, ¿qué ocurre?",["Se le concede una prórroga automática de tres meses para que mejore su desempeño en el cargo.","Regresa automáticamente al empleo provisional que desempeñaba antes de presentarse al concurso.","Su nombramiento se declara insubsistente mediante resolución motivada del nominador.","Se le traslada a otra dependencia con funciones de menor complejidad, sin perder el nombramiento."],2,"Piensa en alguien que todavía no tiene derechos de carrera.","Según el Art. 31, numeral 5, de la Ley 909 de 2004, si quien no está en carrera no aprueba el período de prueba, su nombramiento debe declararse insubsistente por resolución motivada."],
            ["Empleo y control — Vacancia temporal","Un empleado de carrera con derechos gana un concurso para otro empleo y es nombrado en período de prueba. ¿Qué pasa con el empleo del que es titular?",["Queda en vacancia definitiva desde el día de la posesión en el nuevo empleo, y pierde sus derechos de carrera.","Se declara en vacancia temporal mientras supera el período de prueba, y si no lo supera regresa a ese empleo.","Se suprime de la planta de personal de la entidad de origen, y el servidor pasa a ser provisional.","Se asigna en propiedad al siguiente elegible de la lista anterior, aunque el servidor siga en período de prueba."],1,"Piensa en la protección de quien ya tenía derechos de carrera.","Según el Art. 31 de la Ley 909 de 2004, el empleo del que es titular un empleado de carrera en período de prueba en otro cargo se declara vacante temporalmente; si no aprueba el período, regresa a ese empleo."],
            ["Empleo y control — Declaración de bienes y rentas","¿Qué debe declarar bajo juramento el servidor público antes de tomar posesión, al retirarse del cargo o cuando la autoridad se lo pida (Art. 122 CP)?",["El monto de sus deudas y de los créditos que tenga con entidades financieras.","El origen de los recursos de su campaña, si ha participado en elecciones.","Los vínculos de parentesco que tenga con otros servidores de la entidad.","El monto de sus bienes y rentas."],3,"Es una declaración sobre su patrimonio.","El Art. 122 de la Constitución obliga al empleado a declarar, bajo juramento, el monto de sus bienes y rentas antes de tomar posesión, al retirarse del cargo o cuando la autoridad competente se lo solicite."],
            ["Empleo y control — Registro de beneficiarios finales","El Registro Único de Beneficiarios Finales (RUB) hace parte de otro registro y lo administra una entidad. ¿Cuáles son?",["Hace parte del Registro Único de Proponentes (RUP) y lo administran las cámaras de comercio.","Hace parte del Registro Mercantil y lo administra la Superintendencia de Industria y Comercio.","Hace parte del Registro Único Tributario (RUT) y lo administra la DIAN.","Hace parte del Registro Único de Afiliados (RUAF) y lo administra el Ministerio de Salud."],2,"Está relacionado con el registro de los contribuyentes.","El RUB, creado por la Ley 2155 de 2021, hace parte integral del RUT y su funcionamiento y administración están a cargo de la DIAN. La Ley 2195 de 2022 reforzó el deber de debida diligencia sobre beneficiarios finales."],
            ["Empleo y control — Programas de Transparencia y Ética Pública","¿Quiénes deben implementar los Programas de Transparencia y Ética Pública (Ley 2195 de 2022)?",["Solo las entidades del orden nacional que manejen presupuestos superiores a mil salarios mínimos.","Todas las entidades públicas de los órdenes nacional, departamental, distrital y municipal.","Únicamente las empresas privadas que contraten con el Estado, y no las entidades públicas.","Solo las entidades territoriales de categoría especial y de primera categoría."],1,"Es una medida anticorrupción de alcance amplio.","La Ley 2195 de 2022 (art. 31) establece que las entidades públicas de todos los órdenes deben implementar programas de transparencia y ética pública. (Dato tomado de tu archivo; no lo verifiqué en el texto de la ley.)"],
            ["Empleo y control — Inhabilidad","¿Qué es una inhabilidad para ejercer un cargo público?",["Una prohibición para el servidor activo de ejercer otras actividades al mismo tiempo que desempeña su cargo.","El deber de manifestar un interés personal en un trámite y apartarse de la decisión de ese asunto.","Una circunstancia que impide ingresar al servicio público o ejercer el cargo, por ejemplo por tener sanciones o condenas vigentes.","Una sanción disciplinaria que se impone al servidor por incumplir las funciones de su empleo."],2,"Se mira antes de entrar al cargo.","Las inhabilidades son circunstancias que impiden acceder al cargo o ejercerlo, como tener sanciones o condenas vigentes."],
            ["Empleo y control — Incompatibilidad","¿Qué es una incompatibilidad?",["Un impedimento anterior al ingreso, por tener antecedentes penales o disciplinarios que sigan vigentes.","La obligación de apartarse de un trámite en el que se tiene un interés económico o personal directo.","Una prohibición legal para el servidor que está en ejercicio de realizar ciertas actividades al mismo tiempo que su cargo, como contratar con su propia entidad.","Una causal de retiro del servicio que se declara cuando el servidor presenta su renuncia al cargo."],2,"Se mira mientras la persona ejerce el cargo.","Las incompatibilidades son prohibiciones que operan mientras se ejerce el cargo, como celebrar contratos con la propia entidad. Las inhabilidades, en cambio, impiden el ingreso."],
            ["Empleo y control — Conflicto de intereses","¿Cuándo se configura un conflicto de intereses y qué debe hacer el servidor?",["Cuando aspira a un cargo y tiene sanciones vigentes; debe retirar su postulación y esperar a que prescriban.","Cuando tiene un interés económico o personal en un trámite concreto; debe manifestarlo mediante impedimento y apartarse de decidir.","Cuando ejerce otra actividad paralela a su cargo; debe renunciar a esa actividad dentro de los diez días siguientes.","Cuando es investigado por el mismo hecho; debe pedir su traslado a otra dependencia de la entidad."],1,"Hay un interés particular que puede afectar la imparcialidad.","Hay conflicto de intereses cuando el servidor tiene un interés particular y directo en un asunto que debe decidir. Debe declararse impedido y apartarse del trámite."],
            ["Empleo y control — Impedimento (caso)","Un servidor debe decidir un trámite en el que tiene un interés personal directo. ¿Qué debe hacer?",["Resolver el trámite con rapidez y sin informarlo, para no retrasar el despacho de los demás usuarios.","Delegar la firma en un compañero, sin dejar constancia ni manifestar su interés en el asunto.","Manifestar por escrito su impedimento y apartarse, para que otro funcionario decida el trámite.","Solicitar una inhabilidad retroactiva ante la Corte Suprema de Justicia para poder abstenerse."],2,"Lo correcto es declarar el interés y no decidir.","Ante un conflicto de intereses, el servidor debe manifestar el impedimento y apartarse de la decisión; no puede resolver ni delegar de forma encubierta."],
            ["Contratación estatal — Garantías: objetivo","¿Cuál es el objetivo principal de las garantías en los contratos estatales y cómo suelen manifestarse?",["Proteger los recursos públicos y asegurar el cumplimiento de las obligaciones del contratista; suelen manifestarse mediante pólizas, fiducia o garantías bancarias.","Aumentar el presupuesto del contrato y financiar al contratista; suelen manifestarse mediante letras de cambio firmadas ante la entidad.","Reemplazar el contrato principal cuando el contratista incumple; suelen manifestarse mediante hipotecas sobre bienes inmuebles.","Eximir al contratista del pago de impuestos del contrato; suelen manifestarse mediante pagarés firmados ante notario público."],0,"Piensa en qué protegen las garantías y en la póliza como forma más común.","Las garantías buscan proteger los recursos públicos y asegurar que el contratista cumpla sus obligaciones. Lo más frecuente es que se manifiesten en pólizas, aunque también pueden ser fiducia o garantías bancarias."],
            ["Contratación estatal — Garantías: obligatoriedad","Respecto a la obligatoriedad de las garantías en la contratación estatal, ¿qué afirmación es correcta?",["Se exigen sin excepción en todos los contratos estatales, sin importar su valor ni su modalidad de selección.","Solo se exigen cuando el contratista es una empresa extranjera sin domicilio ni sucursal en el país.","No se exigen en absolutamente todos los contratos estatales; la ley contempla excepciones.","Únicamente se exigen en los contratos de prestación de servicios personales de las entidades territoriales."],2,"Cuidado con las reglas que dicen 'siempre' o 'todos'.","Las garantías no se exigen en absolutamente todos los contratos estatales: hay excepciones previstas en la ley."],
            ["Contratación estatal — Garantía de seriedad de la oferta","¿Qué función cumple la garantía de seriedad de la oferta dentro de un proceso de selección?",["Demostrar a la entidad que la propuesta presentada por el oferente es seria y formal.","Cubrir los daños que el contratista cause a terceros durante la ejecución de una obra pública.","Garantizar el pago de las prestaciones sociales de los trabajadores del contratista durante el contrato.","Asegurar que el anticipo entregado se invierta únicamente en la compra de maquinaria para la obra."],0,"Se presenta junto con la propuesta, antes de adjudicar.","La garantía de seriedad de la oferta sirve para demostrarle a la entidad que la propuesta del oferente es seria y formal."],
            ["Contratación estatal — Garantía de cumplimiento","Si durante la ejecución del contrato la entidad impone multas o cláusula penal por fallas del contratista, ¿qué garantía permite cobrarlas a la aseguradora?",["La garantía de responsabilidad civil extracontractual, que cubre los daños que se causen a terceros.","La garantía de cumplimiento, que cubre los perjuicios por incumplimiento y también las multas y la cláusula penal.","La garantía de estabilidad de la obra, que cubre los defectos de calidad que aparezcan después de la entrega.","La garantía de seriedad de la oferta, que cubre el retiro de la propuesta antes de la adjudicación."],1,"Es la garantía que ampara el incumplimiento del contrato.","La garantía de cumplimiento cubre los perjuicios derivados del incumplimiento del contratista y, además, permite cobrar a la aseguradora las multas y la cláusula penal que imponga la entidad."],
            ["Contratación estatal — Anticipo y pago anticipado","¿Cuál es la diferencia entre 'anticipo' y 'pago anticipado', y cuál es su límite legal?",["El anticipo pertenece a la entidad (normalmente se entrega mediante fiducia) y el pago anticipado entra al patrimonio del contratista; ninguno puede superar el 50% del valor del contrato.","El anticipo entra al patrimonio del contratista y el pago anticipado pertenece a la entidad; ninguno puede superar el 30% del valor del contrato.","Ambos pertenecen a la entidad pública y se entregan mediante fiducia; ninguno puede superar el 80% del valor del contrato.","El anticipo es solo para obras públicas y el pago anticipado para suministros; ninguno tiene límite legal."],0,"Piensa en de quién es el dinero una vez entregado.","El anticipo es dinero de la entidad, que normalmente se entrega por medio de fiducia (salvo excepciones legales). El pago anticipado entra directamente al patrimonio del contratista. Ninguno de los dos puede superar el 50% del valor del contrato."],
            ["Contratación estatal — Garantía de estabilidad y calidad","¿Qué ampara la garantía de estabilidad y calidad de la obra, los bienes y los servicios?",["Que los trabajadores del contratista reciban oportunamente sus salarios y prestaciones sociales.","Que el oferente mantenga firme su propuesta económica durante todo el proceso de licitación.","Que lo entregado (obra, bienes o servicios) cumpla con el propósito para el cual fue contratado.","Que la entidad contratante no sea sancionada por los organismos de control del Estado."],2,"Mira lo que recibe la entidad al final.","Este amparo protege a la entidad asegurando que la obra, los bienes o los servicios entregados cumplan con el propósito para el cual se contrataron."],
            ["Contratación estatal — Garantía de salarios y prestaciones","¿Por qué la entidad exige el amparo de salarios y prestaciones sociales?",["Porque la entidad debe pagar directamente la nómina mensual del contratista con los recursos del contrato.","Porque permite al contratista descontar los aportes laborales del anticipo entregado por la entidad.","Porque obliga a la aseguradora a contratar nuevo personal cuando los trabajadores renuncien al contrato.","Porque previene que, si el contratista no paga a sus trabajadores, estos terminen demandando a la entidad contratante."],3,"Piensa en quién puede ser demandado si el contratista no paga.","Si el contratista no le paga a sus propios trabajadores, estos podrían demandar a la entidad contratante; esta garantía previene ese riesgo."],
            ["Contratación estatal — Garantía de responsabilidad civil extracontractual","Durante la ejecución de un contrato, el contratista ocasiona daños materiales a un ciudadano ajeno al contrato. ¿Qué garantía protege a la entidad frente a esta situación?",["La de calidad de los bienes y servicios, que cubre los defectos de lo entregado a la entidad.","La de devolución del pago anticipado, que cubre el dinero entregado antes de iniciar la ejecución.","La de seriedad de la oferta, que cubre el retiro de la propuesta antes de adjudicar el contrato.","La de responsabilidad civil extracontractual, que cubre los daños causados a terceros."],3,"El afectado no es parte del contrato.","La garantía de responsabilidad civil extracontractual protege a la entidad frente a los daños que el contratista pueda ocasionar a terceros."],
            ["Contratación estatal — Norma de supervisión e interventoría","¿Qué norma regula principalmente la supervisión y la interventoría contractual?",["La Ley 80 de 1993, en su artículo 40, que fija el contenido de los contratos estatales.","La Ley 1474 de 2011 (Estatuto Anticorrupción), en su artículo 83.","La Ley 1150 de 2007, en su artículo 7, que regula las garantías contractuales.","El Decreto 1082 de 2015, en su artículo 2, que reglamenta la selección de contratistas."],1,"Es una norma anticorrupción de 2011.","El Art. 83 de la Ley 1474 de 2011 establece las definiciones y reglas generales de la supervisión y la interventoría."],
            ["Contratación estatal — Cuándo procede la interventoría","¿Cuándo procede contratar una interventoría?",["En todos los contratos estatales, sin importar su objeto, su cuantía o su complejidad.","Solamente cuando el valor del contrato supera una cuantía fijada libremente por la entidad.","Cuando el seguimiento requiere conocimiento especializado, o cuando la complejidad o la extensión del contrato lo justifican.","Cuando el contratista la solicita para que un tercero revise la ejecución del contrato."],2,"Depende de la especialidad, la complejidad o la extensión.","Según el Art. 83 de la Ley 1474 de 2011, la interventoría procede cuando el seguimiento exige conocimiento especializado o cuando la complejidad o la extensión del contrato lo justifiquen."],
            ["Contratación estatal — Supervisor e interventor","¿Cuál es la diferencia fundamental entre supervisor e interventor?",["El supervisor es un contratista externo; el interventor es un funcionario de planta de la entidad.","El supervisor ejerce el seguimiento desde la propia entidad; el interventor es una persona contratada para realizarlo.","Ambos deben ser contratistas externos y solo se diferencian en el valor de sus honorarios.","No existe diferencia jurídica, porque la ley usa ambos términos para designar la misma figura."],1,"Mira de dónde viene la persona que hace el seguimiento.","El supervisor actúa desde la entidad estatal. El interventor es una persona natural o jurídica contratada para hacer el seguimiento."],
            ["Contratación estatal — Personal de apoyo a la supervisión","¿Puede la entidad contratar personal de apoyo para la supervisión?",["No, la supervisión debe ejercerla exclusivamente el servidor designado, sin ningún tipo de apoyo externo.","Sí, mediante contratos de prestación de servicios, sin que ello traslade al apoyo la responsabilidad del supervisor.","Sí, pero únicamente mediante contrato laboral y siempre que exista una interventoría contratada.","Solo cuando el contratista lo autorice por escrito y asuma el pago de ese personal de apoyo."],1,"El Art. 83 lo permite, pero no cambia quién responde.","El Art. 83 de la Ley 1474 de 2011 permite contratar personal de apoyo mediante contratos de prestación de servicios. Eso no transfiere automáticamente la responsabilidad del supervisor."],
            ["Contratación estatal — Supervisor e interventor simultáneos","¿Pueden coexistir un supervisor y un interventor en el mismo contrato?",["Sí, cuando la entidad lo justifique y distribuya las funciones: la interventoría cubre unos aspectos y la supervisión los demás.","Nunca, porque la ley prohíbe que dos figuras ejerzan seguimiento sobre un mismo contrato.","Solo en contratos de suministro, en los que la ley permite duplicar las funciones de seguimiento.","Únicamente si el contratista lo autoriza, pues la entidad no puede decidirlo por sí sola."],0,"La entidad puede repartir las funciones según las necesidades del contrato.","El Art. 83 permite que la entidad contrate interventoría y mantenga la supervisión de los aspectos que la interventoría no cubra."],
            ["Contratación estatal — Deber de informar","¿Qué deben hacer supervisores e interventores ante incumplimientos o riesgos del contrato?",["Esperar a que el contratista presente sus informes y actuar solo si este reconoce el incumplimiento.","Informar oportunamente a la entidad sobre los hechos que pongan en riesgo el contrato o evidencien incumplimientos.","Informar únicamente al finalizar el contrato, en el informe final de ejecución y liquidación.","Abstenerse de actuar, porque el seguimiento no les genera responsabilidad por lo ocurrido en la ejecución."],1,"Tienen un deber de información hacia la entidad.","El Art. 84 de la Ley 1474 de 2011 establece el deber de mantener informada a la entidad sobre riesgos, posibles actos de corrupción e incumplimientos. La responsabilidad de los interventores está regulada en el Art. 82."],
            ["Contratación estatal — Certificado de disponibilidad presupuestal","¿Qué documento ampara la existencia de saldo presupuestal disponible antes de iniciar un proceso de contratación?",["El Registro Presupuestal (RP), que certifica que hay recursos para respaldar el proceso.","El acto de adjudicación, que certifica que hay recursos para respaldar el proceso.","El Registro Único de Proponentes (RUP), que certifica que hay recursos para respaldar el proceso.","El Certificado de Disponibilidad Presupuestal (CDP), que certifica que hay recursos para respaldar el proceso."],3,"Se expide antes de abrir el proceso.","El CDP certifica que existe saldo presupuestal disponible para respaldar el proceso de selección. El RP viene después."],
            ["Contratación estatal — Registro presupuestal","En materia contractual, ¿para qué sirve el Registro Presupuestal (RP)?",["Para iniciar la licitación: certifica que existen recursos disponibles antes de abrir el proceso.","Para reemplazar la póliza: asegura el pago del contrato si el contratista incumple.","Para nombrar al interventor: designa a la persona que hará el seguimiento del contrato.","Para perfeccionar el compromiso presupuestal: imputa de forma definitiva los recursos al contrato."],3,"Se hace cuando el contrato ya está firmado.","El CDP se expide antes del proceso (reserva el saldo) y el RP después, al celebrar el contrato: imputa de manera definitiva los recursos y es requisito para ejecutarlo."],
            ["Contratación estatal — Regla general de selección","¿Cuál es la modalidad de selección que constituye la regla general en la contratación estatal?",["La contratación directa, que procede solo en los casos que la ley señala expresamente.","La licitación pública, como regla general de selección objetiva del contratista.","La mínima cuantía, que procede para los contratos de menor valor.","El concurso de méritos, que se utiliza para seleccionar consultores o proyectos de arquitectura."],1,"Las otras modalidades son excepciones.","La Ley 80 de 1993 y la Ley 1150 de 2007 fijan la licitación pública como regla general de selección objetiva."],
            ["Contratación estatal — Interventoría obligatoria","¿En cuál de estos contratos es obligatoria por ley la interventoría?",["En los contratos de obra pública celebrados como resultado de una licitación pública.","En los contratos de prestación de servicios profesionales celebrados por contratación directa.","En las compras de papelería adjudicadas por la modalidad de mínima cuantía.","En los arrendamientos de inmuebles celebrados por las entidades territoriales."],0,"Piensa en obras importantes y en la modalidad más exigente.","El Art. 83 de la Ley 1474 de 2011 dispone que, en los contratos de obra pública celebrados como resultado de una licitación pública, el seguimiento debe ser ejercido por un interventor. (Dato de tu archivo; no lo verifiqué en el texto.)"],
            ["Administrativo — Derecho de petición: término","¿Cuál es el término general para resolver un derecho de petición según la Ley 1755 de 2015?",["Diez días hábiles siguientes a su recepción, para toda clase de peticiones.","Treinta días hábiles siguientes a su recepción, para las peticiones de interés general.","Cinco días hábiles siguientes a su recepción, para las peticiones de interés general.","Quince días hábiles siguientes a su recepción, salvo que una norma especial disponga otro."],3,"Existen términos especiales para documentos y para consultas.","El Art. 14 de la Ley 1755 de 2015 (que sustituye el Art. 14 del CPACA) dispone que, salvo norma especial, toda petición debe resolverse dentro de los 15 días siguientes a su recepción."],
            ["Administrativo — Recurso de queja","¿Qué recurso se interpone ante el superior cuando se rechaza el recurso de apelación?",["El recurso de reposición, para que el mismo funcionario revise su decisión de rechazo.","El recurso de queja, para que el superior decida si concede la apelación.","El recurso de súplica, para que el superior revise la decisión de rechazo del recurso.","La apelación directa, para que el superior revoque el rechazo sin intervención del funcionario."],1,"Es el recurso de la tercera posición del Art. 74 del CPACA.","El recurso de queja (Art. 74 del CPACA) procede ante el superior cuando se rechaza la apelación, para que decida si debió concederse."],
            ["Administrativo — Reposición: plazo","¿Dentro de qué plazo debe interponerse el recurso de reposición contra un acto administrativo?",["Dentro de los 30 días siguientes a la expedición del acto, sin importar cómo se haya notificado.","Dentro de los 5 días siguientes a la notificación personal, sin que proceda cuando se notificó por aviso.","En cualquier tiempo, mientras el acto administrativo no haya sido demandado ante la jurisdicción.","En la diligencia de notificación personal o dentro de los 10 días siguientes a ella, a la notificación por aviso o al vencimiento de la publicación."],3,"Se cuenta desde la notificación.","El Art. 76 del CPACA dispone que los recursos de reposición y apelación se interponen por escrito en la diligencia de notificación personal o dentro de los 10 días siguientes a ella, a la notificación por aviso o al vencimiento del término de publicación. Cualquier tiempo solo aplica a los actos presuntos.",{"url":"recurso_reposicion.html","text":"Para profundizar: guía del recurso de reposición"}]
        ];
