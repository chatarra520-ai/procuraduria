<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Procuraduría - Simulacro Interactivo</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stats-badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .badge-err {
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .badge-ok {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .progress-line {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4b5563;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 1.25rem;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .option-item {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-item.correct {
            border-color: #10b981;
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .option-item.incorrect {
            border-color: var(--danger-text);
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .option-letter {
            font-weight: 700;
            color: #4b5563;
            min-width: 20px;
        }

        .hint-section {
            margin-bottom: 1rem;
        }

        .hint-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0;
        }

        .hint-box {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #f8fafc;
            border-left: 3px solid var(--primary);
            padding: 0.75rem;
            margin-top: 0.5rem;
            border-radius: 0 8px 8px 0;
            display: none;
            line-height: 1.4;
        }

        .feedback-container {
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            line-height: 1.4;
        }

        .deep-link {
            display: inline-block;
            margin-top: 0.6rem;
            font-weight: 700;
            color: inherit;
            text-decoration: underline;
        }

        .feedback-container.show {
            display: block;
        }

        .bottom-nav {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-nav {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-back {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-back:hover:not(:disabled) {
            background-color: #d1d5db;
        }

        .btn-ready {
            background-color: #93c5fd;
            color: #1e3a8a;
        }

        .btn-ready:hover:not(:disabled) {
            background-color: var(--primary);
            color: white;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .results-view {
            text-align: center;
            padding: 2rem 1rem;
            display: none;
        }

        .results-view h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .results-desc {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="quiz-card" id="main-card">
        <div>
            <div class="top-bar">
                <div class="progress-row">
                    <span id="progress-indicator">1 de 98</span>
                    <div class="stats-badges">
                        <div class="badge badge-err">× <span id="err-counter">0</span></div>
                        <div class="badge badge-ok">✓ <span id="ok-counter">0</span></div>
                    </div>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" id="progress-bar-fill"></div>
                </div>
            </div>

            <div id="active-quiz-content">
                <div class="question-header" id="q-mod">Módulo</div>
                <div class="question-title" id="q-title">Cargando...</div>

                <div class="hint-section">
                    <button class="hint-btn" onclick="toggleHint()">Pista <span id="hint-arrow">▼</span></button>
                    <div class="hint-box" id="hint-box-content">Pista aquí</div>
                </div>

                <div class="options-group" id="options-box"></div>

                <div class="feedback-container" id="feedback-box"></div>
            </div>

            <div class="results-view" id="results-view">
                <h2>¡Simulacro Finalizado!</h2>
                <div class="score-display" id="final-score">0/98</div>
                <p class="results-desc" id="final-desc">Has completado el simulacro de preparación para la Procuraduría
                    General de la Nación.</p>
                <button class="btn-nav btn-ready" onclick="restartQuiz()"
                    style="max-width: 250px; margin: 0 auto;">Reiniciar Simulacro</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav-container">
            <button class="btn-nav btn-back" id="btn-back" onclick="handleBack()">Atrás</button>
            <button class="btn-nav btn-ready" id="btn-action" onclick="handleAction()">Listo</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                mod: "Juicio Situacional — Pregunta 2",
                text: "Usted trabaja en una Procuraduría Provincial y es el mejor amigo de un candidato a la Alcaldía de un municipio bajo su jurisdicción. El candidato lo invita a una reunión privada en su casa para que le dé 'algunos consejos' sobre cómo organizar su futuro plan de desarrollo para que no tenga problemas disciplinarios más adelante. La reunión es estrictamente privada y sin prensa. Usted decide:",
                options: [
                    "A) Asistir a la reunión, pues como experto en derecho disciplinario su consejo puede evitar que el futuro alcalde cometa errores, siempre que lo haga de forma gratuita y sin que su cargo en la Procuraduría Provincial se utilice como respaldo de la campaña.",
                    "B) Ir a la reunión, pero pedirle a un colega de la Procuraduría que lo acompañe y deje constancia escrita de que solo se trataron temas académicos y preventivos, de modo que no exista ninguna asesoría directa al candidato sobre su plan de desarrollo.",
                    "C) Declinar la invitación y explicarle a su amigo que, debido a su cargo de control y vigilancia sobre ese mismo municipio, cualquier asesoría o cercanía con su campaña compromete su imparcialidad y podría tipificar una prohibición legal."
                ],
                correct: 2,
                hint: "Principios de imparcialidad, transparencia y prohibición de asesorías a sujetos vigilados.",
                explanation: "El servidor de la PGN no solo debe ser imparcial, sino parecerlo. Las asesorías privadas a sujetos de vigilancia están estrictamente prohibidas por generar conflicto de intereses y comprometer la objetividad institucional."
            },
            {
                mod: "Constitución — Derecho de Petición y Tutela",
                text: "Un ciudadano interpone un escrito ante la Alcaldía solicitando copia simple de las actas de contratación. Transcurridos 12 días hábiles sin respuesta, interpone tutela. De acuerdo con la Ley 1755 de 2015:",
                options: [
                    "A) La tutela es improcedente, toda vez que el plazo legal para responder cualquier escrito es de 30 días hábiles y el ciudadano debió esperar a que venciera ese término antes de acudir al juez.",
                    "B) La tutela es procedente, toda vez que vencido el término especial de 10 días hábiles para documentos e información, la omisión vulnera el derecho fundamental.",
                    "C) El ciudadano debió tramitar obligatoriamente una queja disciplinaria previa contra el servidor, pues la tutela solo procede cuando se ha agotado ese trámite ante la Procuraduría."
                ],
                correct: 1,
                hint: "Términos legales de respuesta para peticiones de documentos e información.",
                explanation: "Las solicitudes de copias y documentos tienen un plazo de 10 días hábiles. Al pasar 12 días sin respuesta, se vulnera el derecho de petición, procediendo la tutela."
            },
            {
                mod: "Estructura del Estado — CAR",
                text: "Al interior de la estructura general del Estado colombiano, las Corporaciones Autónomas Regionales (CAR) se clasifican formalmente en la categoría de:",
                options: [
                    "A) Órganos Autónomos e Independientes con régimen de creación legal y autonomía administrativa y patrimonial.",
                    "B) Unidades pertenecientes a la Rama Ejecutiva del Sector Descentralizado Territorial, con dependencia jerárquica del Gobierno.",
                    "C) Integrantes de la estructura de la Rama Judicial con funciones ambientales y régimen de creación constitucional."
                ],
                correct: 0,
                hint: "Revise el listado de órganos autónomos e independientes de la Constitución.",
                explanation: "Las CAR forman parte de los Órganos Autónomos e Independientes dotados de personería jurídica, autonomía administrativa y patrimonio propio."
            },
            {
                mod: "Organización Electoral — CNE",
                text: "Respecto al Consejo Nacional Electoral (CNE), señale la afirmación jurídicamente CORRECTA sobre su integración y funciones:",
                options: [
                    "A) Sus 9 miembros son elegidos directamente por el Presidente de la República para un período de 8 años y se encargan de la suprema inspección y vigilancia de la organización electoral.",
                    "B) Es una dependencia adscrita administrativamente a la Registraduría Nacional del Estado Civil, cuyos 9 miembros son designados por el Registrador y vigilan la organización electoral.",
                    "C) Sus 9 miembros son elegidos por el Congreso de la República en corporación conjunta y se encargan de la suprema inspección y vigilancia de la organización electoral."
                ],
                correct: 2,
                hint: "Consulte los artículos 120 y 263 de la Constitución Política.",
                explanation: "El CNE se integra por 9 miembros elegidos por el Congreso en corporación conjunta para un período de 4 años, encargados de la suprema inspección y vigilancia electoral."
            },
            {
                mod: "Procuraduría General — Elección",
                text: "El Procurador General de la Nación es elegido conforme a las siguientes reglas del ordenamiento constitucional:",
                options: [
                    "A) Por el Senado de la República para un período de 4 años, a partir de una terna integrada por el Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.",
                    "B) Por la Cámara de Representantes para un período de 4 años, a partir de una terna integrada por el Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.",
                    "C) Por voto popular para un período de 6 años, a partir de una terna integrada por el Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado."
                ],
                correct: 0,
                hint: "Revise el artículo 276 de la Constitución Política.",
                explanation: "El Procurador es elegido por el Senado de la República para un período de 4 años de terna conformada por el Presidente, la Corte Suprema y el Consejo de Estado."
            },
            {
                mod: "Función Administrativa — Desconcentración",
                text: "En materia de administración de la función pública, la desconcentración administrativa consiste en:",
                options: [
                    "A) La creación de una nueva persona jurídica pública con autonomía propia, a la que se trasladan competencias del organismo central.",
                    "B) La radicación de competencias en dependencias jerárquicamente subordinadas del mismo organismo, sin personería jurídica propia.",
                    "C) La transferencia temporal de competencias entre entidades de distinto orden gubernamental, con personería jurídica propia para cada una."
                ],
                correct: 1,
                hint: "Diferencia clave con la descentralización: no crea personería jurídica.",
                explanation: "Según la Ley 489 de 1998, la desconcentración traslada funciones dentro del mismo organismo público a dependencias o cargos subordinados sin crear una persona jurídica nueva."
            },
            {
                mod: "Régimen de Inhabilidades — Nepotismo",
                text: "El principio de prohibición del nepotismo (Art. 126 CP) impide a los servidores públicos con capacidad nominadora efectuar designaciones en personas con parentesco hasta:",
                options: [
                    "A) Segundo grado de consanguinidad, primero de afinidad, primero civil o cónyuge/compañero permanente.",
                    "B) Cuarto grado de consanguinidad, segundo de afinidad y primero civil, sin incluir al cónyuge o compañero permanente.",
                    "C) Cuarto grado de consanguinidad, segundo de afinidad, primero civil o cónyuge/compañero permanente."
                ],
                correct: 2,
                link: { url: "prohibiciones_servidores.html", text: "Para profundizar: prohibiciones de los servidores públicos (arts. 126 a 129)" },
                hint: "Consulte el Acto Legislativo 02 de 2015.",
                explanation: "El Art. 126 de la CP prohíbe el nombramiento o contratación de parientes dentro del cuarto grado de consanguinidad, segundo de afinidad, primero civil o cónyuge/compañero permanente."
            },
            {
                mod: "Empleo Público — Posesión y Presupuesto",
                text: "Un funcionario que pretende posesionarse en un cargo para el que concursó encuentra que el empleo existe en el manual, pero la entidad carece de apropiación presupuestal vigente. Jurídicamente:",
                options: [
                    "A) Debe posesionarse bajo promesa de adición presupuestal posterior (Art. 122 CP), por exigirse únicamente la planta de personal.",
                    "B) El servidor no puede tomar posesión válida del cargo (Art. 122 CP), por exigirse planta y apropiación presupuestal en firme.",
                    "C) La posesión es válida si el Alcalde la autoriza verbalmente (Art. 122 CP), por existir el empleo en el manual de funciones."
                ],
                correct: 1,
                hint: "Revise el artículo 122 de la Constitución Política.",
                explanation: "El Art. 122 de la CP dictamina que para proveer empleos remunerados es requisito constitucional indispensable que estén previstos en la planta de personal y cuenten con apropiación en el presupuesto vigente."
            },
            {
                mod: "Responsabilidad de Servidores",
                text: "Un servidor público destruye culposamente un equipo del inventario fiscal y falsifica un acta formal de baja. Esta conducta unificada desencadena concurrentemente:",
                options: [
                    "A) Únicamente responsabilidad penal, porque absorbe la disciplinaria y la fiscal por tratarse del mismo hecho.",
                    "B) Solamente responsabilidad política ante el Concejo, por ser autónomas e independientes entre sí.",
                    "C) Responsabilidad disciplinaria, penal y fiscal, por ser autónomas e independientes entre sí."
                ],
                correct: 2,
                hint: "Revise el artículo 6 de la CP sobre autonomía de los regímenes de responsabilidad.",
                explanation: "En virtud del Art. 6 de la CP, un mismo hecho genera responsabilidades autónomas e independientes en las ramas penal, disciplinaria y fiscal."
            },
            {
                mod: "Proceso Disciplinario — Pliego de Cargos",
                text: "Dentro de las reglas probatorias y procesales del Código General Disciplinario, ¿cuál actuación procede contra el Auto de Formulación del Pliego de Cargos?",
                options: [
                    "A) No procede ningún recurso de ley, según lo previsto en el Código General Disciplinario.",
                    "B) Recurso de apelación inmediato en efecto suspensivo, según el Código General Disciplinario.",
                    "C) Recurso de reposición y en subsidio apelación, según el Código General Disciplinario."
                ],
                correct: 0,
                link: { url: "recurso_reposicion.html", text: "Para profundizar: guía del recurso de reposición" },
                hint: "Consulte el trámite procesal de la Ley 1952 de 2019 frente al auto de cargos.",
                explanation: "En consonancia con el Código General Disciplinario (Ley 1952 de 2019), contra el auto de formulación de pliego de cargos no procede ningún recurso."
            },
            {
                mod: "Contratación Estatal — Garantías y Anticipos",
                text: "En la contratación estatutaria colombiana, señale la aseveración CORRECTA en materia de garantías y pagos:",
                options: [
                    "A) Anticipo y pago anticipado son idénticos y transfieren el dinero a la propiedad del contratista de forma inmediata.",
                    "B) Ni el anticipo ni el pago anticipado podrán exceder del 50% del valor total del contrato celebrado.",
                    "C) Las garantías son obligatorias sin excepción en contratos de mínima cuantía."
                ],
                correct: 1,
                hint: "Revise los límites legales del anticipo y pago anticipado en contratos estatales.",
                explanation: "Ni el anticipo ni el pago anticipado pueden superar el tope del 50% del monto total del contrato."
            },
            {
                mod: "Contratación Estatal — Interventoría",
                text: "Al comparar la Supervisión y la Interventoría en contratos estatales, ¿cuál afirmación es correcta?",
                options: [
                    "A) El interventor debe ser por ley un funcionario de planta de la entidad contratante, sin posibilidad de contratar personas naturales o jurídicas.",
                    "B) El contrato de interventoría podrá prorrogarse por el mismo plazo en que se prorrogue el contrato vigilado, y a su adición no le aplica el límite del 50% del parágrafo del artículo 40 de la Ley 80.",
                    "C) Si el contrato principal se prorroga, el contrato de interventoría termina automáticamente y la entidad debe asumir la vigilancia con su personal de planta."
                ],
                correct: 1,
                hint: "Revise el artículo 85 de la Ley 1474 de 2011 (continuidad de la interventoría).",
                explanation: "Según el Art. 85 de la Ley 1474 de 2011, los contratos de interventoría podrán prorrogarse por el mismo plazo en que se prorrogue el contrato vigilado (es una posibilidad, no una obligación), y a su adición no se le aplica el límite del parágrafo del Art. 40 de la Ley 80. Esto no elimina los deberes de justificación y control."
            },
            {
                mod: "Banco PGN P1 — Tutela e Indígenas",
                text: "Un personero observa que una comunidad indígena fue desalojada sin trámite previo, vulnerando su debido proceso y territorio. La comunidad carece de recursos. El mecanismo idóneo y sumario es:",
                options: [
                    "A) La Acción Constitucional de Tutela, como mecanismo sumario e inmediato para proteger derechos fundamentales.",
                    "B) La Acción de Cumplimiento, como mecanismo para exigir la aplicación de leyes o actos administrativos.",
                    "C) La Acción Popular, como mecanismo para proteger derechos e intereses colectivos de la comunidad.",
                    "D) El Recurso de Reposición, como mecanismo para pedirle a la autoridad que revise su propia decisión."
                ],
                correct: 0,
                link: { url: "recurso_reposicion.html", text: "Para profundizar: guía del recurso de reposición" },
                hint: "Art. 86 CP: mecanismo sumario e inmediato ante la vulneración de derechos fundamentales.",
                explanation: "El Art. 86 CP establece la Acción de Tutela como el mecanismo sumario e inmediato ante la vulneración de derechos fundamentales."
            },
            {
                mod: "Banco PGN P2 — Participación Ciudadana",
                text: "Ciudadanos organizan una asamblea pública formal con las autoridades distritales y concejales para discutir directamente asuntos de interés local sin votación en urnas. Corresponde a:",
                options: [
                    "A) Plebiscito.",
                    "B) Cabildo Abierto.",
                    "C) Consulta Popular.",
                    "D) Referendo."
                ],
                correct: 1,
                link: { url: "cabildo_abierto.html", text: "Para profundizar: el cabildo abierto (Art. 103 CP)" },
                hint: "Art. 103 CP y Ley 1757 de 2015: mecanismo de participación sin votación en urnas.",
                explanation: "El Cabildo Abierto (Art. 103 CP y Ley 1757/15) es la reunión pública de concejos o JAL para discutir asuntos comunitarios."
            },
            {
                mod: "Banco PGN P3 — Estructura del Estado",
                text: "La Comisión Nacional del Servicio Civil (CNSC) se clasifica dentro de la estructura estatal como:",
                options: [
                    "A) Un Establecimiento Público adscrito al Ministerio del Trabajo, que administra la carrera administrativa.",
                    "B) Una Unidad Administrativa Especial adscrita a la Presidencia de la República, que administra la carrera administrativa.",
                    "C) Un Organismo de Control del Estado con función de vigilancia fiscal, que administra la carrera administrativa.",
                    "D) Un Órgano Autónomo e Independiente de creación constitucional, que administra la carrera administrativa."
                ],
                correct: 3,
                hint: "Art. 130 CP: administración de la carrera administrativa.",
                explanation: "El Art. 130 CP define a la CNSC como un órgano autónomo e independiente de rango constitucional que administra la carrera."
            },
            {
                mod: "Banco PGN P4 — SIVJRNR",
                text: "En el marco del Sistema de Verdad, Justicia y Reparación, la entidad encargada de administrar la justicia transicional es:",
                options: [
                    "A) La Comisión de la Verdad, componente extrajudicial encargado de esclarecer lo ocurrido en el conflicto.",
                    "B) La Jurisdicción Especial para la Paz (JEP), componente judicial autónomo del sistema transicional.",
                    "C) La Unidad de Búsqueda de Personas dadas por Desaparecidas (UBPD), componente humanitario y extrajudicial.",
                    "D) La Corte Suprema de Justicia, máximo tribunal de la jurisdicción ordinaria, que administra la justicia transicional."
