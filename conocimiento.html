<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Procuraduría - Simulacro Interactivo</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stats-badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .badge-err {
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .badge-ok {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .progress-line {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4b5563;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 1.25rem;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .option-item {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-item.correct {
            border-color: #10b981;
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .option-item.incorrect {
            border-color: var(--danger-text);
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .option-letter {
            font-weight: 700;
            color: #4b5563;
            min-width: 20px;
        }

        .hint-section {
            margin-bottom: 1rem;
        }

        .hint-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0;
        }

        .hint-box {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #f8fafc;
            border-left: 3px solid var(--primary);
            padding: 0.75rem;
            margin-top: 0.5rem;
            border-radius: 0 8px 8px 0;
            display: none;
            line-height: 1.4;
        }

        .feedback-container {
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            line-height: 1.4;
        }

        .feedback-container.show {
            display: block;
        }

        .bottom-nav {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-nav {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-back {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-back:hover:not(:disabled) {
            background-color: #d1d5db;
        }

        .btn-ready {
            background-color: #93c5fd;
            color: #1e3a8a;
        }

        .btn-ready:hover:not(:disabled) {
            background-color: var(--primary);
            color: white;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .results-view {
            text-align: center;
            padding: 2rem 1rem;
            display: none;
        }

        .results-view h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .results-desc {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="quiz-card" id="main-card">
        <div>
            <div class="top-bar">
                <div class="progress-row">
                    <span id="progress-indicator">1 de 98</span>
                    <div class="stats-badges">
                        <div class="badge badge-err">× <span id="err-counter">0</span></div>
                        <div class="badge badge-ok">✓ <span id="ok-counter">0</span></div>
                    </div>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" id="progress-bar-fill"></div>
                </div>
            </div>

            <div id="active-quiz-content">
                <div class="question-header" id="q-mod">Módulo</div>
                <div class="question-title" id="q-title">Cargando...</div>

                <div class="hint-section">
                    <button class="hint-btn" onclick="toggleHint()">Pista <span id="hint-arrow">▼</span></button>
                    <div class="hint-box" id="hint-box-content">Pista aquí</div>
                </div>

                <div class="options-group" id="options-box"></div>

                <div class="feedback-container" id="feedback-box"></div>
            </div>

            <div class="results-view" id="results-view">
                <h2>¡Simulacro Finalizado!</h2>
                <div class="score-display" id="final-score">0/98</div>
                <p class="results-desc" id="final-desc">Has completado el simulacro de preparación para la Procuraduría
                    General de la Nación.</p>
                <button class="btn-nav btn-ready" onclick="restartQuiz()"
                    style="max-width: 250px; margin: 0 auto;">Reiniciar Simulacro</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav-container">
            <button class="btn-nav btn-back" id="btn-back" onclick="handleBack()">Atrás</button>
            <button class="btn-nav btn-ready" id="btn-action" onclick="handleAction()">Listo</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                mod: "Juicio Situacional — Pregunta 2",
                text: "Usted trabaja en una Procuraduría Provincial y es el mejor amigo de un candidato a la Alcaldía de un municipio bajo su jurisdicción. El candidato lo invita a una reunión privada en su casa para que le dé 'algunos consejos' sobre cómo organizar su futuro plan de desarrollo para que no tenga problemas disciplinarios más adelante. La reunión es estrictamente privada y sin prensa. Usted decide:",
                options: [
                    "A) Asistir, pues como experto en derecho disciplinario su consejo puede evitar que el futuro alcalde cometa errores, beneficiando el interés general.",
                    "B) Ir a la reunión, pero pedirle a un colega que lo acompañe para que sirva de testigo de que solo se habló de temas académicos y preventivos.",
                    "C) Declinar la invitación y explicarle a su amigo que, debido a su cargo de control y vigilancia sobre ese mismo municipio, cualquier asesoría o cercanía con su campaña compromete su imparcialidad y podría tipificar una prohibición legal."
                ],
                correct: 2,
                hint: "Principios de imparcialidad, transparencia y prohibición de asesorías a sujetos vigilados.",
                explanation: "El servidor de la PGN no solo debe ser imparcial, sino parecerlo. Las asesorías privadas a sujetos de vigilancia están estrictamente prohibidas por generar conflicto de intereses y comprometer la objetividad institucional."
            },
            {
                mod: "Constitución — Derecho de Petición y Tutela",
                text: "Un ciudadano interpone un escrito ante la Alcaldía solicitando copia simple de las actas de contratación. Transcurridos 12 días hábiles sin respuesta, interpone tutela. De acuerdo con la Ley 1755 de 2015:",
                options: [
                    "A) La tutela es improcedente porque el plazo legal es de 30 días hábiles para cualquier escrito.",
                    "B) La tutela es procedente, toda vez que vencido el término especial de 10 días hábiles para documentos e información, la omisión vulnera el derecho fundamental.",
                    "C) El ciudadano debió tramitar obligatoriamente una queja disciplinaria previa."
                ],
                correct: 1,
                hint: "Términos legales de respuesta para peticiones de documentos e información.",
                explanation: "Las solicitudes de copias y documentos tienen un plazo de 10 días hábiles. Al pasar 12 días sin respuesta, se vulnera el derecho de petición, procediendo la tutela."
            },
            {
                mod: "Estructura del Estado — CAR",
                text: "Al interior de la estructura general del Estado colombiano, las Corporaciones Autónomas Regionales (CAR) se clasifican formalmente en la categoría de:",
                options: [
                    "A) Órganos Autónomos e Independientes con régimen de creación legal y autonomía administrativa y patrimonial.",
                    "B) Unidades pertenecientes a la Rama Ejecutiva del Sector Descentralizado Territorial.",
                    "C) Integrantes de la estructura de la Rama Judicial con funciones ambientales."
                ],
                correct: 0,
                hint: "Revise el listado de órganos autónomos e independientes de la Constitución.",
                explanation: "Las CAR forman parte de los Órganos Autónomos e Independientes dotados de personería jurídica, autonomía administrativa y patrimonio propio."
            },
            {
                mod: "Organización Electoral — CNE",
                text: "Respecto al Consejo Nacional Electoral (CNE), señale la afirmación jurídicamente CORRECTA sobre su integración y funciones:",
                options: [
                    "A) Sus 9 miembros son elegidos directamente por el Presidente de la República por 8 años.",
                    "B) Es una dependencia adscrita administrativamente a la Registraduría Nacional del Estado Civil.",
                    "C) Sus 9 miembros son elegidos por el Congreso de la República en corporación conjunta y se encargan de la suprema inspección y vigilancia de la organización electoral."
                ],
                correct: 2,
                hint: "Consulte los artículos 120 y 263 de la Constitución Política.",
                explanation: "El CNE se integra por 9 miembros elegidos por el Congreso en corporación conjunta para un período de 4 años, encargados de la suprema inspección y vigilancia electoral."
            },
            {
                mod: "Procuraduría General — Elección",
                text: "El Procurador General de la Nación es elegido conforme a las siguientes reglas del ordenamiento constitucional:",
                options: [
                    "A) Por el Senado de la República para un período de 4 años, a partir de una terna integrada por el Presidente de la República, la Corte Suprema de Justicia y el Consejo de Estado.",
                    "B) Por voto directo de los ciudadanos en comicios presidenciales para período de 4 años.",
                    "C) Por la Cámara de Representantes de terna del Defensor del Pueblo."
                ],
                correct: 0,
                hint: "Revise el artículo 275 de la Constitución Política.",
                explanation: "El Procurador es elegido por el Senado de la República para un período de 4 años de terna conformada por el Presidente, la Corte Suprema y el Consejo de Estado."
            },
            {
                mod: "Función Administrativa — Desconcentración",
                text: "En materia de administración de la función pública, la desconcentración administrativa consiste en:",
                options: [
                    "A) La creación de una nueva persona jurídica pública con autonomía propia.",
                    "B) La radicación de competencias en dependencias jerárquicamente subordinadas del mismo organismo, sin personería jurídica propia.",
                    "C) La transferencia temporal de competencias entre entidades de distinto orden gubernamental."
                ],
                correct: 1,
                hint: "Diferencia clave con la descentralización: no crea personería jurídica.",
                explanation: "Según la Ley 489 de 1998, la desconcentración traslada funciones dentro del mismo organismo público a dependencias o cargos subordinados sin crear una persona jurídica nueva."
            },
            {
                mod: "Régimen de Inhabilidades — Nepotismo",
                text: "El principio de prohibición del nepotismo (Art. 126 CP) impide a los servidores públicos con capacidad nominadora efectuar designaciones en personas con parentesco hasta:",
                options: [
                    "A) Segundo grado de consanguinidad y primer grado de afinidad únicamente.",
                    "B) Solamente cónyuge o compañera en matrimonio católico.",
                    "C) Cuarto grado de consanguinidad, segundo de afinidad, primero civil o cónyuge/compañero permanente."
                ],
                correct: 2,
                hint: "Consulte el Acto Legislativo 02 de 2015.",
                explanation: "El Art. 126 de la CP prohíbe el nombramiento o contratación de parientes dentro del cuarto grado de consanguinidad, segundo de afinidad, primero civil o cónyuge/compañero permanente."
            },
            {
                mod: "Empleo Público — Posesión y Presupuesto",
                text: "Un funcionario que pretende posesionarse en un cargo para el que concursó encuentra que el empleo existe en el manual, pero la entidad carece de apropiación presupuestal vigente. Jurídicamente:",
                options: [
                    "A) Debe posesionarse bajo promesa de adición presupuestal posterior.",
                    "B) El servidor no puede tomar posesión válida del cargo (Art. 122 CP), por exigirse planta y apropiación presupuestal en firme.",
                    "C) La posesión es válida si el Alcalde lo autoriza verbalmente."
                ],
                correct: 1,
                hint: "Revise el artículo 122 de la Constitución Política.",
                explanation: "El Art. 122 de la CP dictamina que para proveer empleos remunerados es requisito constitucional indispensable que estén previstos en la planta de personal y cuenten con apropiación en el presupuesto vigente."
            },
            {
                mod: "Responsabilidad de Servidores",
                text: "Un servidor público destruye culposamente un equipo del inventario fiscal y falsifica un acta formal de baja. Esta conducta unificada desencadena concurrentemente:",
                options: [
                    "A) Únicamente responsabilidad penal.",
                    "B) Solamente responsabilidad política ante el Concejo.",
                    "C) Responsabilidad disciplinaria, penal y fiscal, por ser autónomas e independientes entre sí."
                ],
                correct: 2,
                hint: "Revise el artículo 6 de la CP sobre autonomía de los regímenes de responsabilidad.",
                explanation: "En virtud del Art. 6 de la CP, un mismo hecho genera responsabilidades autónomas e independientes en las ramas penal, disciplinaria y fiscal."
            },
            {
                mod: "Proceso Disciplinario — Pliego de Cargos",
                text: "Dentro de las reglas probatorias y procesales del Código General Disciplinario, ¿cuál actuación procede contra el Auto de Formulación del Pliego de Cargos?",
                options: [
                    "A) No procede ningún recurso de ley.",
                    "B) Recurso de apelación inmediato en efecto suspensivo.",
                    "C) Recurso de reposición y en subsidio apelación."
                ],
                correct: 0,
                hint: "Consulte el trámite procesal de la Ley 1952 de 2019 frente al auto de cargos.",
                explanation: "En consonancia con el Código General Disciplinario (Ley 1952 de 2019), contra el auto de formulación de pliego de cargos no procede ningún recurso."
            },
            {
                mod: "Contratación Estatal — Garantías y Anticipos",
                text: "En la contratación estatutaria colombiana, señale la aseveración CORRECTA en materia de garantías y pagos:",
                options: [
                    "A) Anticipo y pago anticipado son idénticos y transfieren el dinero a la propiedad del contratista de forma inmediata.",
                    "B) Ni el anticipo ni el pago anticipado podrán exceder del 50% del valor total del contrato celebrado.",
                    "C) Las garantías son obligatorias sin excepción en contratos de mínima cuantía."
                ],
                correct: 1,
                hint: "Revise los límites legales del anticipo y pago anticipado en contratos estatales.",
                explanation: "Ni el anticipo ni el pago anticipado pueden superar el tope del 50% del monto total del contrato."
            },
            {
                mod: "Contratación Estatal — Interventoría",
                text: "Al comparar legalmente la Supervisión y la Interventoría en contratos estatales, resulta de obligatorio cumplimiento la siguiente regla:",
                options: [
                    "A) El interventor debe ser por ley un funcionario de planta de la entidad.",
                    "B) La interventoría tiene límite de adición en valor de hasta el 10% sin excepciones.",
                    "C) Si el contrato principal es prorrogado en su plazo de ejecución, el contrato de interventoría correspondiente debe ser prorrogado obligatoriamente."
                ],
                correct: 2,
                hint: "Consulte el Estatuto Anticorrupción (Ley 1474 de 2011, Art. 83).",
                explanation: "Según la Ley 1474 de 2011, la interventoría sigue la suerte del contrato principal; si este se prorroga, la interventoría debe prorrogarse obligatoriamente."
            },
            {
                mod: "Banco PGN P1 — Tutela e Indígenas",
                text: "Un personero observa que una comunidad indígena fue desalojada sin trámite previo, vulnerando su debido proceso y territorio. La comunidad carece de recursos. El mecanismo idóneo y sumario es:",
                options: [
                    "A) Acción Constitucional de Tutela.",
                    "B) Acción de Cumplimiento.",
                    "C) Acción Popular.",
                    "D) Recurso de Reposición."
                ],
                correct: 0,
                hint: "Art. 86 CP: mecanismo sumario e inmediato ante la vulneración de derechos fundamentales.",
                explanation: "El Art. 86 CP establece la Acción de Tutela como el mecanismo sumario e inmediato ante la vulneración de derechos fundamentales."
            },
            {
                mod: "Banco PGN P2 — Participación Ciudadana",
                text: "Ciudadanos organizan una asamblea pública formal con las autoridades distritales y concejales para discutir directamente asuntos de interés local sin votación en urnas. Corresponde a:",
                options: [
                    "A) Plebiscito.",
                    "B) Cabildo Abierto.",
                    "C) Consulta Popular.",
                    "D) Referendo."
                ],
                correct: 1,
                hint: "Art. 103 CP y Ley 1757 de 2015: mecanismo de participación sin votación en urnas.",
                explanation: "El Cabildo Abierto (Art. 103 CP y Ley 1757/15) es la reunión pública de concejos o JAL para discutir asuntos comunitarios."
            },
            {
                mod: "Banco PGN P3 — Estructura del Estado",
                text: "La Comisión Nacional del Servicio Civil (CNSC) se clasifica dentro de la estructura estatal como:",
                options: [
                    "A) Establecimiento Público adscrito a MinTrabajo.",
                    "B) Unidad Administrativa Especial.",
                    "C) Organismo de Control.",
                    "D) Órgano Autónomo e Independiente de creación constitucional."
                ],
                correct: 3,
                hint: "Art. 130 CP: administración de la carrera administrativa.",
                explanation: "El Art. 130 CP define a la CNSC como un órgano autónomo e independiente de rango constitucional que administra la carrera."
            },
            {
                mod: "Banco PGN P4 — SIVJRNR",
                text: "En el marco del Sistema de Verdad, Justicia y Reparación, la entidad encargada de administrar la justicia transicional es:",
                options: [
                    "A) Comisión de la Verdad.",
                    "B) Jurisdicción Especial para la Paz (JEP).",
                    "C) UBPD.",
                    "D) Corte Suprema."
                ],
                correct: 1,
                hint: "Acto Legislativo 01 de 2017: componente judicial del sistema transicional.",
                explanation: "El Acto Legislativo 01 de 2017 creó la JEP como el componente judicial autónomo del sistema transicional."
            },
            {
                mod: "Banco PGN P5 — Rama Ejecutiva",
                text: "Un organismo con personería jurídica, autonomía administrativa y patrimonio propio destinado a prestar servicios técnicos pertenece a:",
                options: [
                    "A) Departamento Administrativo.",
                    "B) Unidad Administrativa sin personería.",
                    "C) Establecimiento Público.",
                    "D) Consejo Superior."
                ],
                correct: 2,
                hint: "Ley 489 de 1998, Art. 70: entidades descentralizadas por servicios.",
                explanation: "Según la Ley 489 de 1998 (Art. 70), los Establecimientos Públicos son descentralizados por servicios con personería y patrimonio."
            },
            {
                mod: "Banco PGN P6 — Rama Judicial",
                text: "Supremo tribunal de la Jurisdicción de lo Contencioso Administrativo que conoce de nulidad y restablecimiento del derecho contra actos nacionales:",
                options: [
                    "A) Corte Suprema de Justicia.",
                    "B) Consejo de Estado.",
                    "C) Corte Constitucional.",
                    "D) Comisión Disciplinaria."
                ],
                correct: 1,
                hint: "Art. 237 CP.",
                explanation: "El Art. 237 CP señala al Consejo de Estado como el tribunal supremo de lo contencioso administrativo."
            },
            {
                mod: "Banco PGN P7 — Órganos de Control PGN",
                text: "Sustento constitucional que faculta preferentemente a la Procuraduría para investigar a un Gobernador:",
                options: [
                    "A) Potestad delegada del Consejo de Estado.",
                    "B) Cláusula general de competencia disciplinaria sobre la conducta oficial (Arts. 118 y 277 CP).",
                    "C) Control fiscal concomitante.",
                    "D) Delegación de Fiscalía."
                ],
                correct: 1,
                hint: "Revise los Arts. 118 y 277 de la Constitución Política.",
                explanation: "Según el PDF, los Arts. 118 y 277 de la Carta Política otorgan a la PGN la vigilancia de la conducta oficial y el control disciplinario."
            },
            {
                mod: "Banco PGN P8 — Control Fiscal",
                text: "Facultad expedita de la Contraloría para intervenir mientras un proyecto vial con sobrecostos está en ejecución sin coadministrar:",
                options: [
                    "A) Control Posterior y Selectivo.",
                    "B) Acción de Repetición.",
                    "C) Juicio de Cuentas.",
                    "D) Control Preventivo y Concomitante."
                ],
                correct: 3,
                hint: "Acto Legislativo 04 de 2019: control fiscal en tiempo real.",
                explanation: "El Acto Legislativo 04 de 2019 introdujo el control fiscal preventivo y concomitante en tiempo real."
            },
            {
                mod: "Banco PGN P9 — Organización Electoral",
                text: "Impugnación para revocar la inscripción de candidato a Gobernador por inhabilidad sobreviniente. Compete a:",
                options: [

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuestions() {
            questions.forEach(q => {
                const items = q.options.map((t, i) => ({ t: stripLetter(t), c: i === q.correct }));
                shuffleArray(items);
                q.options = items.map((o, i) => String.fromCharCode(65 + i) + ') ' + o.t);
                q.correct = items.findIndex(o => o.c);
                q.explanation = q.explanation.replace(/^Respuesta [A-D] \(Correcta\):\s*/, '');
            });
        }
        prepareQuestions();

        let currentIndex = 0;
        let userSelections = new Array(questions.length).fill(null);
        let lockedStates = new Array(questions.length).fill(false);
        let successCount = 0;
        let errorCount = 0;

        const progressIndicator = document.getElementById('progress-indicator');
        const okCounter = document.getElementById('ok-counter');
        const errCounter = document.getElementById('err-counter');
        const progressBarFill = document.getElementById('progress-bar-fill');

        const qMod = document.getElementById('q-mod');
        const qTitle = document.getElementById('q-title');
        const hintBoxContent = document.getElementById('hint-box-content');
        const hintArrow = document.getElementById('hint-arrow');
        const optionsBox = document.getElementById('options-box');
        const feedbackBox = document.getElementById('feedback-box');

        const btnBack = document.getElementById('btn-back');
        const btnAction = document.getElementById('btn-action');

        const activeQuizContent = document.getElementById('active-quiz-content');
        const resultsView = document.getElementById('results-view');
        const bottomNavContainer = document.getElementById('bottom-nav-container');

        function renderQuestion() {
            const q = questions[currentIndex];
            qMod.textContent = q.mod;
            qTitle.textContent = q.text;
            hintBoxContent.textContent = q.hint;
            hintBoxContent.style.display = 'none';
            hintArrow.textContent = '▼';

            progressIndicator.textContent = `${currentIndex + 1} de ${questions.length}`;
            const pct = Math.round(((currentIndex + 1) / questions.length) * 100);
            progressBarFill.style.width = pct + '%';

            optionsBox.innerHTML = '';
            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-item';

                const letterSpan = document.createElement('span');
                letterSpan.className = 'option-letter';
                letterSpan.textContent = optText.charAt(0);

                const textSpan = document.createElement('span');
                textSpan.textContent = optText.slice(3);

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);

                const isLocked = lockedStates[currentIndex];
                const selectedIdx = userSelections[currentIndex];

                if (isLocked) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('correct');
                    } else if (idx === selectedIdx) {
                        btn.classList.add('incorrect');
                    }
                } else {
                    if (selectedIdx === idx) {
                        btn.classList.add('selected');
                    }
                    btn.onclick = () => selectOption(idx);
                }

                optionsBox.appendChild(btn);
            });

            if (lockedStates[currentIndex]) {
                showFeedbackUI(userSelections[currentIndex] === q.correct, q);
                btnAction.textContent = currentIndex === questions.length - 1 ? 'Resultados' : 'Siguiente';
                btnAction.disabled = false;
            } else {
                feedbackBox.classList.remove('show');
                btnAction.textContent = 'Listo';
                btnAction.disabled = userSelections[currentIndex] === null;
            }

            btnBack.disabled = currentIndex === 0;
        }

        function selectOption(idx) {
            if (lockedStates[currentIndex]) return;
            userSelections[currentIndex] = idx;

            const buttons = optionsBox.getElementsByClassName('option-item');
            for (let i = 0; i < buttons.length; i++) {
                if (i === idx) {
                    buttons[i].classList.add('selected');
                } else {
                    buttons[i].classList.remove('selected');
                }
            }
            btnAction.disabled = false;
        }

        function handleAction() {
            const isLocked = lockedStates[currentIndex];

            if (!isLocked) {
                if (userSelections[currentIndex] === null) return;
                lockedStates[currentIndex] = true;

                const q = questions[currentIndex];
                const isCorrect = userSelections[currentIndex] === q.correct;

                if (isCorrect) {
                    successCount++;
                    okCounter.textContent = successCount;
                } else {
                    errorCount++;
                    errCounter.textContent = errorCount;
                }

                renderQuestion();
            } else {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showResultsScreen();
                }
            }
        }

        function handleBack() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function showFeedbackUI(isCorrect, q) {
            const letter = String.fromCharCode(65 + q.correct);
            feedbackBox.classList.add('show');
            if (isCorrect) {
                feedbackBox.style.backgroundColor = '#d1fae5';
                feedbackBox.style.color = '#065f46';
                feedbackBox.innerHTML = `<strong>✓ Respuesta correcta (${letter})</strong><br>${q.explanation}`;
            } else {
                feedbackBox.style.backgroundColor = '#fee2e2';
                feedbackBox.style.color = '#991b1b';
                feedbackBox.innerHTML = `<strong>× Respuesta incorrecta. La correcta es la ${letter}</strong><br>${q.explanation}`;
            }
        }

        function toggleHint() {
            if (hintBoxContent.style.display === 'block') {
                hintBoxContent.style.display = 'none';
                hintArrow.textContent = '▼';
            } else {
                hintBoxContent.style.display = 'block';
                hintArrow.textContent = '▲';
            }
        }

        function showResultsScreen() {
            activeQuizContent.style.display = 'none';
            bottomNavContainer.style.display = 'none';
            document.querySelector('.top-bar').style.display = 'none';

            document.getElementById('final-score').textContent = `${successCount} / ${questions.length}`;
            resultsView.style.display = 'block';
        }

        function restartQuiz() {
            currentIndex = 0;
            successCount = 0;
            errorCount = 0;
            userSelections = new Array(questions.length).fill(null);
            lockedStates = new Array(questions.length).fill(false);
            okCounter.textContent = '0';
            errCounter.textContent = '0';

            // Rebarajar opciones en cada reinicio
            prepareQuestions();

            resultsView.style.display = 'none';
            activeQuizContent.style.display = 'block';
            bottomNavContainer.style.display = 'flex';
            document.querySelector('.top-bar').style.display = 'flex';

            renderQuestion();
        }

        renderQuestion();
    </script>

</body>

</html>
