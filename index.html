<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulacros - Índice</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .index-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }

        .index-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .index-kicker {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .index-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .menu-item {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            text-decoration: none;
        }

        .menu-item:hover {
            background-color: #eff6ff;
            border-color: var(--primary);
        }

        .menu-number {
            font-weight: 700;
            color: #4b5563;
            min-width: 20px;
        }

        .menu-text {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .menu-name {
            font-weight: 600;
        }

        .menu-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .notice {
            display: none;
            margin-top: 1rem;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .notice.show {
            display: block;
        }
    </style>
</head>

<body>

    <div class="index-card">
        <div class="index-header">
            <div class="index-kicker">Procuraduría General de la Nación</div>
            <div class="index-title">Elige un simulacro</div>
        </div>

        <div class="menu-group">
            <a class="menu-item" href="conocimiento.html">
                <span class="menu-number">1</span>
                <span class="menu-text">
                    <span class="menu-name">Quiz Procuraduría</span>
                    <span class="menu-desc">Preguntas normativas y de juicio situacional.</span>
                </span>
            </a>

            <a class="menu-item" href="comportamental.html">
                <span class="menu-number">2</span>
                <span class="menu-text">
                    <span class="menu-name">Quiz Comportamental</span>
                    <span class="menu-desc">50 preguntas de juicio situacional y comportamiento laboral.</span>
                </span>
            </a>
        </div>
    </div>

</body>

</html>
