<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Integridad DIAN - Simulacro</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .quiz-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .stats-badges {
            display: flex;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .badge-err {
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .badge-ok {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .progress-line {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4b5563;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 1.25rem;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .option-item {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background-color: #f9fafb;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .option-item:hover:not(:disabled) {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        .option-item.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-item.correct {
            border-color: #10b981;
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .option-item.incorrect {
            border-color: var(--danger-text);
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        .option-letter {
            font-weight: 700;
            color: #4b5563;
            min-width: 20px;
        }

        .hint-section {
            margin-bottom: 1rem;
        }

        .hint-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0;
        }

        .hint-box {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: #f8fafc;
            border-left: 3px solid var(--primary);
            padding: 0.75rem;
            margin-top: 0.5rem;
            border-radius: 0 8px 8px 0;
            display: none;
            line-height: 1.4;
        }

        .feedback-container {
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
            line-height: 1.4;
        }

        .feedback-container.show {
            display: block;
        }

        .bottom-nav {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-nav {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-back {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-back:hover:not(:disabled) {
            background-color: #d1d5db;
        }

        .btn-ready {
            background-color: #93c5fd;
            color: #1e3a8a;
        }

        .btn-ready:hover:not(:disabled) {
            background-color: var(--primary);
            color: white;
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .results-view {
            text-align: center;
            padding: 2rem 1rem;
            display: none;
        }

        .results-view h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .results-desc {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="quiz-card" id="main-card">
        <div>
            <div class="top-bar">
                <div class="progress-row">
                    <span id="progress-indicator">1 de 40</span>
                    <div class="stats-badges">
                        <div class="badge badge-err">× <span id="err-counter">0</span></div>
                        <div class="badge badge-ok">✓ <span id="ok-counter">0</span></div>
                    </div>
                </div>
                <div class="progress-line">
                    <div class="progress-fill" id="progress-bar-fill"></div>
                </div>
            </div>

            <div id="active-quiz-content">
                <div class="question-header" id="q-mod">Módulo</div>
                <div class="question-title" id="q-title">Cargando...</div>

                <div class="hint-section">
                    <button class="hint-btn" onclick="toggleHint()">Pista <span id="hint-arrow">▼</span></button>
                    <div class="hint-box" id="hint-box-content">Pista aquí</div>
                </div>

                <div class="options-group" id="options-box"></div>

                <div class="feedback-container" id="feedback-box"></div>
            </div>

            <div class="results-view" id="results-view">
                <h2>¡Simulacro Finalizado!</h2>
                <div class="score-display" id="final-score">0/40</div>
                <p class="results-desc" id="final-desc">Has completado el simulacro de integridad de la DIAN.</p>
                <button class="btn-nav btn-ready" onclick="restartQuiz()"
                    style="max-width: 250px; margin: 0 auto;">Reiniciar Simulacro</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav-container">
            <button class="btn-nav btn-back" id="btn-back" onclick="handleBack()">Atrás</button>
            <button class="btn-nav btn-ready" id="btn-action" onclick="handleAction()">Listo</button>
        </div>
    </div>

                0,
                "Piensa en la ratificación del juramento de integridad de los servidores de la DIAN.",
                "El juramento compromete a todos los servidores a obrar como ejemplo y a cumplir y hacer cumplir la Constitución y las leyes tributarias, aduaneras y cambiarias. (Este texto viene de tu material; el Código de ética de la DIAN incluye la ratificación del juramento, pero no confirmé la redacción exacta.)"
            ],
            [
                "El Manifiesto Institucional de la DIAN consolida el sentir y la razón de ser de todos los servidores de la entidad en el territorio nacional. ¿Cuáles son los dos pilares fundamentales que unifican a los colaboradores de la DIAN según el Manifiesto?",
                [
                    "La maximización del recaudo a cualquier costo y el estricto cumplimiento del horario presencial, que hacen posible la existencia y el desarrollo de nuestro país.",
                    "El respeto por la diferencia y el compromiso sagrado de recaudar los recursos económicos que hacen posible la existencia y el desarrollo de nuestro país.",
                    "La sustitución total de la fiscalización humana por sistemas de inteligencia artificial desatendida, que hacen posible la existencia y el desarrollo de nuestro país."
                ],
                1,
                "Piensa en el Manifiesto Institucional (la descripción vívida de la DIAN).",
                "El Manifiesto de la DIAN habla de la diferencia y del compromiso sagrado de recaudar los recursos que hacen posible la existencia y el desarrollo del país."
            ]
        ];

        const questions = RAW.map((r, i) => ({
            mod: "Integridad DIAN — Pregunta " + (i + 1),
            text: r[0],
            options: r[1].map((t, j) => String.fromCharCode(65 + j) + ") " + t),
            correct: r[2],
            hint: r[3],
            explanation: r[4]
        }));

        // ===== Barajar opciones y reetiquetar letras =====
        // Así la respuesta correcta no queda siempre en la misma posición.
        function stripLetter(s) { return s.replace(/^[A-D]\)\s*/, ''); }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareQuestions() {
            questions.forEach(q => {
                const items = q.options.map((t, i) => ({ t: stripLetter(t), c: i === q.correct }));
                shuffleArray(items);
                q.options = items.map((o, i) => String.fromCharCode(65 + i) + ') ' + o.t);
                q.correct = items.findIndex(o => o.c);
                q.explanation = q.explanation.replace(/^Respuesta [A-D] \(Correcta\):\s*/, '');
            });
        }
        prepareQuestions();

        let currentIndex = 0;
        let userSelections = new Array(questions.length).fill(null);
        let lockedStates = new Array(questions.length).fill(false);
        let successCount = 0;
        let errorCount = 0;

        const progressIndicator = document.getElementById('progress-indicator');
        const okCounter = document.getElementById('ok-counter');
        const errCounter = document.getElementById('err-counter');
        const progressBarFill = document.getElementById('progress-bar-fill');

        const qMod = document.getElementById('q-mod');
        const qTitle = document.getElementById('q-title');
        const hintBoxContent = document.getElementById('hint-box-content');
        const hintArrow = document.getElementById('hint-arrow');
        const optionsBox = document.getElementById('options-box');
        const feedbackBox = document.getElementById('feedback-box');

        const btnBack = document.getElementById('btn-back');
        const btnAction = document.getElementById('btn-action');

        const activeQuizContent = document.getElementById('active-quiz-content');
        const resultsView = document.getElementById('results-view');
        const bottomNavContainer = document.getElementById('bottom-nav-container');

        function renderQuestion() {
            const q = questions[currentIndex];
            qMod.textContent = q.mod;
            qTitle.textContent = q.text;
            hintBoxContent.textContent = q.hint;
            hintBoxContent.style.display = 'none';
            hintArrow.textContent = '▼';

            progressIndicator.textContent = `${currentIndex + 1} de ${questions.length}`;
            const pct = Math.round(((currentIndex + 1) / questions.length) * 100);
            progressBarFill.style.width = pct + '%';

            optionsBox.innerHTML = '';
            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-item';

                const letterSpan = document.createElement('span');
                letterSpan.className = 'option-letter';
                letterSpan.textContent = optText.charAt(0);

                const textSpan = document.createElement('span');
                textSpan.textContent = optText.slice(3);

                btn.appendChild(letterSpan);
                btn.appendChild(textSpan);

                const isLocked = lockedStates[currentIndex];
                const selectedIdx = userSelections[currentIndex];

                if (isLocked) {
                    btn.disabled = true;
                    if (idx === q.correct) {
                        btn.classList.add('correct');
                    } else if (idx === selectedIdx) {
                        btn.classList.add('incorrect');
                    }
                } else {
                    if (selectedIdx === idx) {
                        btn.classList.add('selected');
                    }
                    btn.onclick = () => selectOption(idx);
                }

                optionsBox.appendChild(btn);
            });

            if (lockedStates[currentIndex]) {
                showFeedbackUI(userSelections[currentIndex] === q.correct, q);
                btnAction.textContent = currentIndex === questions.length - 1 ? 'Resultados' : 'Siguiente';
                btnAction.disabled = false;
            } else {
                feedbackBox.classList.remove('show');
                btnAction.textContent = 'Listo';
                btnAction.disabled = userSelections[currentIndex] === null;
            }

            btnBack.disabled = currentIndex === 0;
        }

        function selectOption(idx) {
            if (lockedStates[currentIndex]) return;
            userSelections[currentIndex] = idx;

            const buttons = optionsBox.getElementsByClassName('option-item');
            for (let i = 0; i < buttons.length; i++) {
                if (i === idx) {
                    buttons[i].classList.add('selected');
                } else {
                    buttons[i].classList.remove('selected');
                }
            }
            btnAction.disabled = false;
        }

        function handleAction() {
            const isLocked = lockedStates[currentIndex];

            if (!isLocked) {
                if (userSelections[currentIndex] === null) return;
                lockedStates[currentIndex] = true;

                const q = questions[currentIndex];
                const isCorrect = userSelections[currentIndex] === q.correct;

                if (isCorrect) {
                    successCount++;
                    okCounter.textContent = successCount;
                } else {
                    errorCount++;
                    errCounter.textContent = errorCount;
                }

                renderQuestion();
            } else {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showResultsScreen();
                }
            }
        }

        function handleBack() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function showFeedbackUI(isCorrect, q) {
            const letter = String.fromCharCode(65 + q.correct);
            feedbackBox.classList.add('show');
            if (isCorrect) {
                feedbackBox.style.backgroundColor = '#d1fae5';
                feedbackBox.style.color = '#065f46';
                feedbackBox.innerHTML = `<strong>✓ Respuesta correcta (${letter})</strong><br>${q.explanation}`;
            } else {
                feedbackBox.style.backgroundColor = '#fee2e2';
                feedbackBox.style.color = '#991b1b';
                feedbackBox.innerHTML = `<strong>× Respuesta incorrecta. La correcta es la ${letter}</strong><br>${q.explanation}`;
            }
        }

        function toggleHint() {
            if (hintBoxContent.style.display === 'block') {
                hintBoxContent.style.display = 'none';
                hintArrow.textContent = '▼';
            } else {
                hintBoxContent.style.display = 'block';
                hintArrow.textContent = '▲';
            }
        }

        function showResultsScreen() {
            activeQuizContent.style.display = 'none';
            bottomNavContainer.style.display = 'none';
            document.querySelector('.top-bar').style.display = 'none';

            document.getElementById('final-score').textContent = `${successCount} / ${questions.length}`;
            resultsView.style.display = 'block';
        }

        function restartQuiz() {
            currentIndex = 0;
            successCount = 0;
            errorCount = 0;
            userSelections = new Array(questions.length).fill(null);
            lockedStates = new Array(questions.length).fill(false);
            okCounter.textContent = '0';
            errCounter.textContent = '0';

            // Rebarajar opciones en cada reinicio
            prepareQuestions();

            resultsView.style.display = 'none';
            activeQuizContent.style.display = 'block';
            bottomNavContainer.style.display = 'flex';
            document.querySelector('.top-bar').style.display = 'flex';

            renderQuestion();
        }

        renderQuestion();
    </script>

</body>

</html>
